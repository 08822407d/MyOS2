ca_rulings:
- issue_id: CA-01
  ruling: SUPPORTED_IN_SCOPE
  cases:
  - V04
  - V05
  - V06
  - V07
  basis: 原函数片段：非 current 唤醒经 set_task_cpu 进入自有 running_lhdr 并置 RUNNING，却返回 0；状态掩码未筛选（含 TASK_NEW）；串行重复唤醒不重复入队；任务 CPU 元数据不随 set_task_cpu 更新，唤醒与新任务都放 CPU0
  not_established:
  - 完整唤醒正确性
  - SMP 放置
- issue_id: CA-02
  ruling: FUNCTION_LEVEL_SUPPORTED_REACHABILITY_COUNTEREVIDENCE
  cases:
  - V08
  basis: 阻塞 current + 空队列时原函数返回 current；但 idle 以 RUNNING 切出时被重新挂回队列，使非 idle current 下 count=0 不可达，除非 idle 以非 RUNNING 状态切出（夹具序列显示此前提一旦出现即到达该组合）
  not_established:
  - idle 上下文绝不睡眠（kernel_thread/copy_process 未读）
- issue_id: CA-03
  ruling: SUPPORTED_IN_SCOPE
  cases:
  - V09
  - V10
  - V11
  basis: 有限 timeout 原样返回、不调度、状态保持 UNINTERRUPTIBLE；msleep 在 100 步内不前进；MAX 路径调度一次；done 预置走快路径
  not_established:
  - 真实到期分发
  - 有限 timeout 的活动调用者影响面（msleep 未见活动调用者；semaphore 路径未追到调用者）
- issue_id: CA-04
  ruling: SUPPORTED_IN_SCOPE
  cases:
  - V02
  - V03
  - V11
  basis: 摘链后 count 保持 1；再次唤醒或全唤醒第三轮把 anchor 当作 waiter，其 task 字段即队列锁字；completion 复用时同样触发
  not_established:
  - 真实内核中的崩溃/挂死形态
- issue_id: CA-05
  ruling: SUPPORTED_AT_SOURCE_AND_MODEL_LEVEL
  cases:
  - V14
  basis: 源码与构建引用成立；宿主别名模型一次调用 +2（对照 +1）
  not_established:
  - ELF 符号核对
  - 实际时基/倍率
- issue_id: CA-06
  ruling: SUPPORTED_AT_SOURCE_LEVEL
  cases:
  - V00
  - V01
  basis: 'A35 位于活动的 #ifdef CONFIG_BUG 分支且 CONFIG_BUG 在 CMAKE_C_FLAGS 中定义；A36/A37 为脚本顶层行；未运行脚本或虚拟机'
  not_established:
  - 任何运行时观测通道的可靠性
- issue_id: CA-07
  ruling: SUPPORTED_BY_HOST_ORIGINAL_SLICE
  cases:
  - V12
  - V13
  basis: 原 asm 实测为减法语义；trylock 成功不改锁字、可重复成功，而真实持锁时返回失败
  not_established:
  - 多核原子性与完整自旋锁正确性
