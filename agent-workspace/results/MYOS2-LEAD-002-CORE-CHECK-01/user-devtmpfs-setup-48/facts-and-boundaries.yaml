        "err=register_filesystem(dev_fs_type)",
        "if(err) return err",
        "thread=kthread_run(devtmpfsd,&err,kdevtmpfs)",
        "if(!IS_ERR(thread)) wait_for_completion(setup_done) else err=PTR_ERR(thread),thread=NULL",
        "while(err);",
        "if(err) unregister_filesystem then return err",
        "pr_info then return0"
