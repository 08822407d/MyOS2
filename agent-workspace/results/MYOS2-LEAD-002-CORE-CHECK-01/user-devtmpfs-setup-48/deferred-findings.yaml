      "claim": "调用方传给kthread_run的是自己的自动int err的地址；kthread_run/kthread_create宏只将data指针传向下层创建接口。devtmpfsd完整活动函数体不读取/解引用参数p，而是另建局部int err并用它接收init_mount结果，之后return该局部int。setup_done完成接口传completion对象指针，wait_for_completion返回void；所选路径没有把工作err写给调用方err，工作函数的int return并不等于调用方局部err的值。",
