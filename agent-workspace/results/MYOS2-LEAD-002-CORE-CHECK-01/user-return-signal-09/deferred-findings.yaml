  claim: 08 在 user-syscall-stdio.md 的 §0、§3.1、§3.2、§4.6、§5、§8 与 facts-and-boundaries.yaml 的 entry.syscall_dispatch、AS2-05、PU-02、GAP-U10 中，把 do_syscall_64 写入（或越界时不写）的 regs->ax 写成用户看到或拿回的 rax，并把号检查写成“号转成无符号”。源码中，do_syscall_64 分派后无条件经 syscall_exit_to_user_mode 调用 arch_do_signal_or_restart：没有信号递送且 (int)orig_ax ≠ -1 时，ax 为 -512、-513、-514 会被改为 orig_ax 并令 ip 减 2，为 -516 会被改为 219 并令 ip 减 2；有信号递送时，ax、ip、sp、di、si、dx、cs、ss、flags 都可能被改写；rt_sigreturn 则在分派阶段、restore_sigcontext 成功时由用户帧恢复 15 个通用寄存器与 sp、ip（cs、ss 取用户值或上 3，flags 只取 FIX_EFLAGS 所列的位），并把 orig_ax 置为 -1。返回段装入 rax 的是这一步之后帧中的 ax。号检查只看 movslq 之后、以 int 接收的 eax。
  correction: 以附注追加，08 原文件不改。(1) 08 中凡写“用户看到的 rax”“用户拿回”“用户态 rax = 返回值”之处，都读作“分派后 regs->ax（分派局部结果）”。(2) 号检查：入口 movslq 把 eax 符号扩展进 rsi，do_syscall_64 以 int nr 接收，再 uint unr = nr 与 453 比较；rax 高 32 位不参与（推断）。(3) 帧分四段：分派前 orig_ax 与 ax 都是入口 64 位 rax；分派只在 unr < 453 且处理函数返回时写 ax；返回尾部无条件调用 arch_do_signal_or_restart，按 stdio-08-disposition.md §3.2 改写；返回段把这之后帧中的 ax、ip、flags、sp 装入 rax、rcx、r11、rsp，再 swapgs、sti、sysretq。(4) “rax 等于分派值”的充分条件是四条同时成立：号在表内且处理函数返回；没有信号递送（get_signal 为假）；没有重启改写（(int)orig_ax 为 -1，或分派写入的 64 位值不是 -512、-513、-514、-516）；正常到达 syscall_return_via_sysret。这是充分条件，不是必要条件，有信号递送时 ax 可能不变，也可能被改为 -EINTR、orig_ax 或 0。以“返回尾部不写帧并到达返回段”为准，第 1、3、4 条必要；第 2 条不必要，可以放宽为“没有成功建立信号帧（get_signal 为假，或建帧在改写寄存器之前失败）”，放宽后四条合起来是充要条件。越界号时第 1 条换成“分派不写 ax，控制到达返回尾部”，分派值换成入口的 64 位 rax；只比数值时另有三种数值相等而帧已改写的情形，不算未改写返回。全文见 user-return-signal.md“衔接”一节 L2，简述见 stdio-08-disposition.md §3.3。(5) 越界号“ax 不被写”只是分派局部事实：64 位 rax 恰为 -512、-513、-514、-516 时，没有信号也会由重启分支改写帧：四种都令 ip 减 2，-516 另把 ax 改为 219，-512、-513、-514 的 ax 写回同值；这些改写是源码事实，“回到同一条 syscall 指令”以及由此而来的原地循环或以 219 再次进入，都是按 ISA 的推断（NOT_RUN）。sysretq 之后用户态实际看到什么属 NOT_RUN（GAP-U04 剩余部分）。逐处改读见 stdio-08-disposition.md §3.7，取代 08 §3.2 的表见其 §3.5。
