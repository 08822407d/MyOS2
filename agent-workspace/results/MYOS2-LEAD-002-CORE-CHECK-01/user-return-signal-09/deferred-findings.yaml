    二、失败无人处理。handle_signal 在 :204 调 setup_rt_frame，把结果记入 failed AD0-07。failed 只在 :205 被读 SD-96：成功时只清 DF/RF/TF signal.c:216（QD-L09），失败时什么也不做。:222 的 signal_setup_done(failed, ksig, stepping) 是 // 注释 SD-97；mykernel 中 signal_setup_done 没有定义，force_sigsegv 只有一条注释掉的 extern（include/linux/sched/signal.h:135），signal_delivered 没有出现 QD-151。handle_signal 返回后，mykernel/arch/x86_64/lock_IPC/signal/signal.c 的 arch_do_signal_or_restart 在 :251 直接 return，跳过 :254-270 的无处理函数重启分支 AD0-08。它在 exit_to_user_mode_loop 中只被无条件调用一次，外层循环与门禁都是注释（CORE-USER-BOUNDARIES-07::AB2-12、CORE-USER-BOUNDARIES-07::SB-14、CORE-USER-BOUNDARIES-07::SB-15），同一次返回不会重试。

    三、信号已出队。进入 handle_signal 之前，get_signal 已把信号出队 signal.c:916（QD-L31）：collect_signal 清位、摘链 signal.c:187（QD-L31），再释放节点 signal.c:195（QD-L31）。get_signal 先把动作复制进 ksig->ka，带 SA_ONESHOT 时再把表项复位为 SIG_DFL signal.c:942（QD-L31），然后 break 返回 signal.c:945（QD-L31）。

