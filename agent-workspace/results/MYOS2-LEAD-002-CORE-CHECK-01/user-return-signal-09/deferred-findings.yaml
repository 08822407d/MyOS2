5、E27 登记。本条只新增三点：rt_sigreturn 这个入口；get_user 的返回值恒为 0，使 :257、:259 的 goto badframe 不可达；异常表只有生产者、没有消费者，使 :56-57 的失败返回也到不了（推断）。copy_from_user 不做 access_ok 属 RS-11，在本入口没有单独后果：:254 已按整帧长度做过 access_ok，被复制的 uc_mcontext 又夹在先执行的两处 get_user 的地址之间（推断）。'
