  claim: 07 由“号不小于 453 时 do_syscall_64 不写 regs->ax”推出“返回原 rax，用户得到原系统调用号”，没有计入返回尾部。exit_to_user_mode_loop 无条件调用 arch_do_signal_or_restart（CORE-USER-BOUNDARIES-07::SB-15），其中的重启逻辑会把帧中 ax 恰为 -512、-513、-514、-516（64 位补码）的情形当作 ERESTART 码，改写 ax 与 ip。分派阶段的事实没有错；错在把它当成返回用户态时的值。
  correction: UB-09 中越界号一句改为：号按 (uint)(int)eax 不小于 453 时，分派不写 regs->ax，帧中 ax 仍是入口的完整 64 位 rax；返回段装入 rax 的是返回尾部之后帧中的 ax。帧中 ax（同时也是 orig_ax）恰为 -512、-513、-514、-516 时，(int)orig_ax 不是 -1，重启逻辑在源码层面改写帧：① 没有处理函数时（get_signal 为假），-512、-513、-514 得到 ax = orig_ax（写回同一个值）与 ip -= 2，-516 得到 ax = 219（__NR_restart_syscall）与 ip -= 2；② 有处理函数时，-514、-516 以及不带 SA_RESTART 的 -512 得到 ax = -EINTR、ip 不变，-513 以及带 SA_RESTART 的 -512 得到 ax = orig_ax、ip -= 2；建帧成功时这些值存入信号帧，要等处理函数经 restorer 发出 rt_sigreturn 才恢复（用户态行为，推断），建帧失败时直接保留（CORE-USER-RETURN-SIGNAL-09::RS-02）。“回到同一条 syscall 指令、反复进出内核”与“以 219 再次进入、停在 __x64_sys_ni_syscall 的 while (1)”都是按 ISA 语义的推断（NOT_RUN），前者还要求每次重入时 get_signal 仍为假。对其余 64 位值，重启 switch 不改写 ax 与 ip；没有信号投递并正常到达 syscall_return_via_sysret 时，返回段装入 rax 的就是入口 rax。这只是充分条件：有信号投递而建帧失败时 ax 同样不变，建帧成功时 ax 先被置 0 交给处理函数，要等处理函数经 rt_sigreturn 返回才恢复（推断）。sysretq 之后用户态实际看到什么属 NOT_RUN。
  unchanged_parts: [UB-09 第一个边角不变：号小于 453 而表中没有时，经 x64_sys_call 的 default 落到 __x64_sys_ni_syscall，打印后 while (1), UB-09 第三个边角不变：SYSRET 适用性判断不被使用，没有 IRET 后备；本包另有一条证据追加补充 rt_sigreturn 一环, '分派阶段的事实不变：号不小于 453 时 do_syscall_64 不写 regs->ax（CORE-USER-SYSCALL-STDIO-08::AS2-05）。07 facts-and-boundaries.yaml 中 entry.syscall_frame_return 的 failure_path“号不小于 __NR_syscalls 时 ax 保持原值（即系统调用号）”在 do_syscall_64 这一点仍成立，只是不能当作返回用户态时的值', UB-09 的 kind、status、owner_action_now 与 future_verification 不变；本勘误不升级、不关闭 UB-09, '08 包中的同义表述不在本条范围，按 SR08-02 处置（CORE-USER-RETURN-SIGNAL-09::ER-02）']
  premises: [无额外前提：依据是所读快照中的源码文本与原文]
  impact: 消费 07 时，UB-09 中越界号的返回值以本条为准。对 -512、-513、-514、-516 这四个 64 位值，返回尾部在源码层面改写帧，不能再按“用户得到原系统调用号”消费：没有信号投递时四种都令 ip 减 2，-516 另把 ax 改为 219；-512、-513、-514 的 ax 写回同值，返回段装入 rax 的数值仍是原号，但 ip 已减 2，用户是否把它当作返回值拿到属 ISA 推断（NVR-3）；有信号投递时按重启表改写。后果见本包对 UB-09 的越界号证据追加与 CORE-USER-RETURN-SIGNAL-09::RS-05。对其余值，没有信号投递并正常到达返回段是 07 说法成立的充分条件，不是必要条件（有信号投递而建帧在改写寄存器之前失败时 ax 同样不变）。UB-09 的状态不因本条改变。
