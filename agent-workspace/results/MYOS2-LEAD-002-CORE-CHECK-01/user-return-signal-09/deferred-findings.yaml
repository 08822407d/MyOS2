  premises: ['handle_signal 被调用。按源码，这就等于 get_signal 在 :945 选中了 sa_handler 既不是 SIG_IGN 也不是 SIG_DFL 的表项：默认致命动作的 do_group_exit 是注释（RS-03），那条路不会返回 true。', 'setup_rt_frame 返回负值，二者之一。(a) ksig->ka.sa.sa_flags 不含 SA_RESTORER：若 RS-01 成立，经 rt_sigaction 注册的处理函数全都如此；若不成立，取决于注册时是否带这一位（libc 在仓库外）。(b) 带 SA_SIGINFO 且 copy_siginfo_to_user 返回非零 signal.c:1063（QD-L31）：源码上只对应 copy_to_user 或 clear_user 的地址检查失败 AD2-12 uaccess_64.h:192（QD-L07）。copy_user_generic 或 __clear_user 要返回剩余字节数，只能靠 _ASM_EXTABLE_UA 登记的修复跳转 uaccess_64.h:115、:179（QD-L07），而 mykernel 中没有异常表的查找或修复函数 QD-76，按 RS-06、RS-07 的同一推断到不了。帧地址由用户可控的 regs->sp 或 sigaltstack 经 get_sigframe 算出，而 :178-186 已先直接写过帧（RS-08）；(b) 在什么条件下能不先出错就到达，没有确认（推断）。', （只对“改写保留”这一后果）(int)regs->orig_ax != -1，且 regs->ax 恰好是 -516、-514、-512、-513 之一，即 -ERESTART_RESTARTBLOCK、-ERESTARTNOHAND、-ERESTARTSYS、-ERESTARTNOINTR。]
  impact: '- 源码层面：已出队的这次信号没有投递，也没有替代处理：没有 SIGSEGV 发送代码，没有重新入队，没有打印。带 SA_ONESHOT 的表项已复位为 SIG_DFL；按 CORE-USER-VFS-BASELINE-05::UV-14，各任务共用 init_sighand，复位对所有任务生效（推断，见 RS-12）。

