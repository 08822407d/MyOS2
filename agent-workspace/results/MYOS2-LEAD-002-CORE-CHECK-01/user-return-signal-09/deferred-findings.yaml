  claim: 08 在 user-syscall-stdio.md、deferred-findings.yaml、facts-and-boundaries.yaml 与 evidence.md 的 34 处，把 write、writev、fcntl 的不配对 fput 写成“每次”“返回前”“无条件”，或只把成功的 F_DUPFD 列为例外；user-syscall-stdio.md §0 第 3 条还把 fcntl(F_DUPFD) 写成唯一能复制 fd 的命令，漏了同样经 f_dupfd 的 F_DUPFD_CLOEXEC。源码中三处调用者都先判空：空槽返回 -EBADF，不执行 fdput 或 fdput_pos；fdput_pos 位于 file 非空的分支内，在 vfs_write、vfs_writev 返回后执行；sys_fcntl 在 file 非空时经 out1 执行 fdput，空槽 goto out 跳过它。成功的 F_DUPFD 与成功的 F_DUPFD_CLOEXEC 共用 f_dupfd 的 get_file，净值为零；失败的 F_DUPFD 要分 from ≥ RLIMIT_NOFILE（净减一）与 alloc_fd 找不到空槽（不给净值）；FMODE_PATH 下被白名单拒绝的命令也经 out1 执行 fdput（推断走不到）。下标越界、槽悬空或未写入、扫描越过 256 项、fd_install 覆盖非空槽（panic 在源码层面会返回）与控制未到达清理，都不给确定净值。
