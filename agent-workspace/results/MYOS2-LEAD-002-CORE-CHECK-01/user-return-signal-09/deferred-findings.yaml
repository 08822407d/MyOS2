  claim: '一、调用点。两个信号设置系统调用先检查 sigsetsize，再用 copy_from_user 读入用户结构：rt_sigaction syscall.c:33（QD-L37）；rt_sigprocmask syscall.c:61（QD-L37） syscall.c:67（QD-L37）。

    二、copy_from_user 不检查地址。copy_from_user（mykernel/include/linux/kernel/uaccess.h:185-194）无条件转调 _inline_copy_from_user，check_copy_size 与 #ifdef 分支都是 // 注释 uaccess.h:190（QD-L25） SD-98。_inline_copy_from_user（:149-167）中，:153 的 access_ok 条件行和 :163 的闭括号，连同 :152、:154-160、:162，都是 // 注释；:161 的 raw_copy_from_user 是活动代码，所以无条件执行 AD2-10 uaccess.h:161（QD-L25） SD-99 SD-100。raw_copy_from_user 转调 copy_user_generic uaccess_64.h:127（QD-L07）；后者只有 stac、ALTERNATIVE("rep movsb", …) 与 clac，没有地址判断 uaccess_64.h:104（QD-L07） SD-102。它登记了一个 _ASM_EXTABLE_UA 表项 uaccess_64.h:115（QD-L07） QD-156，但 mykernel 中没有异常表的消费者 QD-157。

    三、对照。_inline_copy_to_user 保留活动的 access_ok AD2-12 SD-101。access_ok 只有一处定义 access_ok.h:41（QD-L26）。asm/uaccess.h 先在 :14 包含 uaccess_64.h，再在 :16 包含 access_ok.h QD-158；access_ok.h 的另一个包含者 uapi/asm-generic/uaccess.h 没有被任何文件包含 QD-159。uaccess_64.h:92 的宏 uaccess_64.h:92（QD-L07） 使 access_ok.h:19 的通用版本被跳过，所以用的是 x86 的 __access_ok。若编译器内联并把 __builtin_constant_p 折叠为真，对这里的小常量尺寸，它就是 valid_user_address(ptr) uaccess_64.h:85（QD-L07），即 (long)x >= 0 AD2-04 QD-160；否则走另一支，要求起始地址加长度后仍非负且不回绕 AD2-05。走哪一支源码上不能确定（推断，未构建，同 RS-07），两支都拒绝负的起始地址。

    四、结论与范围。act、nset 不经 valid_user_address 判定就成为复制源。copy_from_user 全仓只有这一个定义，活动调用点 5 处：本条两处，以及 arch/x86_64/lock_IPC/signal/signal_64.c:56、fs/fat/myos_fat32.c:227、time/misc/time_misc.c:279 QD-155。其中 signal_64.c:56 的调用方 sys_rt_sigreturn 先自己做了 access_ok，不受本条影响（见 counter_evidence）；后两处本条未追。CORE-USER-VFS-BASELINE-05::UV-05、CORE-USER-BOUNDARIES-07::UB-07、CORE-USER-SYSCALL-STDIO-08::US-05 讲的是根本没有调用复制原语；本条讲的是复制原语自身缺 access_ok，两者不重复。'
  premises: ['rt_sigaction 以 act != NULL 调用，或 rt_sigprocmask 以 nset != NULL 调用（13、14 号是 CORE-USER-SYSCALL-STDIO-08::VT-SYSTAB 中的活动表项）。', 'sigsetsize == sizeof(sigset_t)；否则 syscall.c:31、:62 先返回 -EINVAL，到不了复制。', '传入的地址属于 x86 __access_ok 会拒绝的那一类（假如 copy_from_user 做了这项检查）：常量分支下即不满足 valid_user_address 的高半区地址（含内核地址）；若走非常量分支，还包括起点落在 [2^63 − n, 2^63) 的低半区地址（n 为复制长度：act 为 sizeof(new_sa.sa)，nset 为 sizeof(sigset_t)）。走哪个分支取决于编译器是否内联并折叠 __builtin_constant_p，源码层面无法确定（推断，同 RS-07；未构建）。其余低半区地址有没有 access_ok 结果都一样，所以只有这一类地址受本条影响。']
