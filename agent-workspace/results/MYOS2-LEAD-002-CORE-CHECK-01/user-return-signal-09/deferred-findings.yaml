- qualified_id: CORE-USER-RETURN-SIGNAL-09::RS-01
  id: RS-01
  title: （按 include 顺序推断）signal.c 翻译单元里 UAPI_SA_FLAGS 不含 SA_RESTORER：rt_sigaction 存入的 sa_flags 被清掉这一位，投递时 x64_setup_rt_frame 第 168 行判断成立、第 169 行返回 -EFAULT
  kind: [conditional_inference, evidence_gap]
  status: needs_evidence
  owner_action_now: none
  source_ref: {branch: claude/dazzling-cori-q0dnyt, path: agent-workspace/results/MYOS2-LEAD-002-CORE-CHECK-01/user-return-signal-09/deferred-findings.yaml, entry_id: RS-01, results_commit: 见 MANIFEST.md 的 results_commit_short12}
  capabilities: [ipc.signal.action_mask_syscalls, ipc.signal.frame_setup]
  claim: '本条是由 include 文本推出的预处理推断，没有预处理或编译输出核实，需要构建侧检查 NVR-2，所以状态为 needs_evidence。

    一、掩码怎样定：signal_const.h:89-95 在 #ifndef __ARCH_UAPI_SA_FLAGS 内按 #ifdef SA_RESTORER 二选一，已定义时取 SA_RESTORER signal_const.h:91（QD-L33），否则取 0 signal_const.h:93（QD-L33）；UAPI_SA_FLAGS 把它并入 AD2-18。其余各位在 signal-defs.h 中依次为 0x1、0x2、0x4、0x800、0x08000000、0x10000000、0x40000000、0x80000000，都不是 0x04000000 QD-148；signal-defs.h 只在 :51-54 的注释里提到 SA_RESTORER。

    二、核对过的包含关系（a039d9803ade 源码文本）：

    (1) 全仓只有一处 SA_RESTORER 定义 AD2-01；__ARCH_UAPI_SA_FLAGS 只在 signal_const.h:91、:93 定义；构建文件（options_flags.cmake:17、21、34-35、58-70 与 arch/x86_64/CMakeLists.txt:2-4 的 -D 列表）都不含这两个名字 QD-139。

    (2) 头文件中只有 include/uapi/linux/signal.h:5 包含 <asm/signal.h>；另外 3 处在 .c 文件（arch/x86_64/myos/syscall.c:14、sched/forkexec/fork.c:26、sched/forkexec/kthread.c:13），不属于本翻译单元。<uapi/linux/signal.h> 只被 lock_IPC/signal/signal.h:10 包含。signal_const.h 只被 lock_IPC/lock_ipc_const.h:9 包含，lock_ipc_const.h 由 signal.h:6 包含。引号形式的 "signal.h" 另有两处：arch/x86_64/lock_IPC/signal/signal_api_arch.h:5 按同目录规则指向 arch/x86_64/lock_IPC/signal/signal.h（只含 myos_debug_option.h 与两个 arch 头），lock_IPC/signal/signal_api.h:4 指向受守卫保护的 lock_IPC/signal/signal.h。<linux/sched/signal.h>、<uapi/asm-generic/signal.h> 等同名头都不包含上述两个头 QD-140。

    (3) signal.c 第 1 行只有 #define SIGNAL_DEFINATION signal.c:1（QD-L31），这个宏只在 signal.h:132 的 #if 中使用，位于 :10 之后，不影响包含顺序 QD-142。第 2 行的 #include "signal.h" 是本翻译单元的第一个包含，按引号包含先查本目录的规则指向 lock_IPC/signal/signal.h；signal.c 的其余包含都在它之后 QD-143。

    (4) 守卫名 _LINUX_SIGNAL_H_、_LOCK_IPC_CONST_H_、_SIGNAL_CONSTS_H_ 各只出现在自己的文件里，没有 #undef QD-141。所以 signal.h:10 在本翻译单元只处理一次，而且在 :4、:6、:7、:8 的整个传递闭包之后；闭包中即使再包含 signal.h，也被守卫挡住。因此不必穷举 :4、:6 的传递包含（例如 :6 已经经 semaphore_const.h:4、lock_ipc_type_declaration.h:6 带入 signal-defs.h）。

    (5) 没有宏形式的 #include 或 #include_next QD-144；被 #include 的 .c 只有 kbuild 的 asm-offsets_64.c QD-145。

    (6) 构建：全仓的 -include/-imacros 只命中 compiler_types.h:135，它在 :130-137 的块注释里 QD-146；按名检索到的编译选项设置只有 target_kbuild.cmake:19，给 asm-offset 目标加 -save-temps QD-147；C 编译带 -nostdinc options_flags.cmake:43（QD-L41）；signal.c 由 GLOB_RECURSE 收入 KERNEL_C_SRCS CMakeLists.txt:30（QD-L02），随后只从中去掉 kbuild 文件 CMakeLists.txt:32（QD-L02）。

    据此推断：在 signal.c 翻译单元中，signal_const.h:90 被处理时 SA_RESTORER 还没有定义，:93 生效，UAPI_SA_FLAGS 不含 0x04000000。

    三、数据流（活动代码）：sys_rt_sigaction 复制用户 sigaction 后调用 do_sigaction，这是 do_sigaction 唯一的活动调用点 AD2-19 QD-72。sys_rt_sigaction 在另一个翻译单元，但掩码在 do_sigaction 所在的 signal.c 翻译单元展开。do_sigaction 对 act 与 oact 各做一次掩码 signal.c:1197（QD-L31） SD-92；:1199 的 sigaction_compat_abi 是注释，之后没有活动代码按名加回这一位 SD-93；然后在 :1204 写入 action[sig-1] AD2-17。投递时，get_signal 只在表项既不是 SIG_IGN 也不是 SIG_DFL 时把它复制进 ksig->ka AD3-18；arch_do_signal_or_restart 调 handle_signal AD0-08；handle_signal 在 :204 调 setup_rt_frame AD0-07；setup_rt_frame 唯一的活动分支转调 x64_setup_rt_frame，ia32/x32 分支（:153-159）都是注释 signal.c:161（QD-L09）。x64_setup_rt_frame 的 :167 是 /* */ 注释，:168 判断 sa_flags 不含 SA_RESTORER，:169 返回 -EFAULT AD0-13 SD-94；get_sigframe 在这之后的 :171 才被调用 AD3-12。'
  premises: [signal.c 翻译单元的预处理顺序如 claim 第二段所述：这是由 include 文本与守卫推出的，没有预处理输出，NVR-2 未运行。, '构建中没有本次检索看不到的注入：例如 CMake 首次配置时经环境变量 CFLAGS 或命令行带入的 CMAKE_C_FLAGS 初值（options_flags.cmake 把内核选项拼在原值之后 options_flags.cmake:40（QD-L41）；CMake 初值的来源属外部语义，未核），或仓库外的构建包装在 signal_const.h 之前定义了 SA_RESTORER 或 __ARCH_UAPI_SA_FLAGS。', '用户进程经 rt_sigaction（13 号，CORE-USER-SYSCALL-STDIO-08::VT-SYSTAB 中的活动表项）为某个信号装了 sa_handler 不是 SIG_DFL/SIG_IGN 的处理函数，之后该信号在一次经 syscall_exit_to_user_mode 的返回中被 get_signal 选中。']
  impact: '以下都以推断成立为条件，只描述源码数据流，不断言运行结果。

    - 经 rt_sigaction 安装的处理函数，存入 action[] 的 sa_flags 都没有 SA_RESTORER，与用户是否设置无关；经 oact 读回的 sa_flags 也没有这一位（:1196-1197，再由 sys_rt_sigaction 写回用户 AD2-20）。

    - 投递时 x64_setup_rt_frame 在 :169 返回。这发生在 get_sigframe 之前（:171 是它唯一的活动调用点 QD-71），也在全部帧写入之前，还在把 regs 改成处理函数入口之前 AD0-16。handle_signal 只在 :204 记下 failed，:222 的 signal_setup_done 是注释（RS-02）。这条失败路径上没有活动的 SIGSEGV 发送代码，源码上也不会把 regs->ip 改成处理函数地址。按源码数据流，经 rt_sigaction 注册的处理函数都投递不出去。

    - 对经 rt_sigaction 注册的处理函数，signal_64.c:171 之后（含 get_sigframe）都到不了。因此 RS-08、RS-09 与 RS-10 的建帧一侧都以“RS-01 不成立”为前提。本包两条只记事实的记录也受影响：sigcontext 的 trapno/err/cr2 写入 AD3-11 到不了；get_sigframe 的旧式 altstack 分支要求 sa_flags 不含 SA_RESTORER signal.c:66（QD-L09），而 get_sigframe 只在 :168 判断之后才被调用，所以这个分支无论本条是否成立都进不去；本条成立时，连 get_sigframe 本身也到不了。

    - RS-12 中“一个进程装的处理函数地址被别的进程当作有效地址”的后果被遮蔽：失败发生在 regs->ip 被改写之前。但 SA_RESETHAND 在 UAPI_SA_FLAGS 之内，带它的表项仍会先在 get_signal 中被复位（见 RS-02）。

    - 内核不再建立信号帧，rt_sigreturn 只能由用户直接发出 15 号调用进入，帧内容完全由用户给出（推断）；RS-06、RS-07 与 RS-10 的恢复一侧不受本条影响。

    - 若推断不成立（SA_RESTORER 被保留），上述条目按各自前提成立；RS-02 的失败来源只剩“注册时不带 SA_RESTORER”与“SA_SIGINFO 复制失败”两种。'
  counter_evidence: [这是 include 文本推断，没有预处理输出。若构建中有前提 2 所说的注入，结论反转。, 检索范围内没有反证：SA_RESTORER 的唯一定义、包含位点、守卫名、宏形式包含、强制包含、-D 列表都已核对（见 claim 第二段）。, 'signal_64.c 翻译单元中 SA_RESTORER 必须已定义，否则 :168 无法编译（推断）。两个翻译单元看到的状态不同并不矛盾：掩码在 signal.c 翻译单元的 do_sigaction 中展开，这正是推断的关键。', '没有找到绕过 do_sigaction 改写标志的代码：sa_flags 的赋值只有 :1195、:1197 两处掩码，action[] 的整体写入只有 :1204 与 fork.c:765 按值复制父任务的表 QD-149；get_signal 只写 sa_handler signal.c:943（QD-L31）。词法检索不能排除经函数指针或宏拼接的写入。', '只有用户真的装了处理函数并收到该信号时才有后果。仓库内的活动用户源码没有可达的注册：myinitramfs 中唯一的 signal() 调用在 tests.c 的 test_all 里，test_all 唯一的调用点 myshell.c:81 是注释 QD-150；libc 内部未知（CORE-USER-VFS-BASELINE-05::GAP-U10）。']
