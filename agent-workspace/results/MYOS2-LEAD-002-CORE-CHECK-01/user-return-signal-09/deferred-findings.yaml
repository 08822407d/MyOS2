  added_facts: ['15 号 rt_sigreturn 是活动表项（CORE-USER-SYSCALL-STDIO-08::VT-SYSTAB）。它取 current_pt_regs()（SD-48），即 task_pt_regs(current)（QD-64），改写的就是 entry_SYSCALL_64 建立、返回段消费的那块帧（沿用 07 的推导：CORE-USER-BOUNDARIES-07::EB-23、CORE-USER-BOUNDARIES-07::VT-KFRAME；生成偏移的数值未核）。', 'rt_sigreturn 对帧只做地址范围检查（access_ok，AD3-13），restore_sigcontext 只检查 copy_from_user 的结果（AD3-08），都不检查取到的字段值；restore_sigcontext 中没有 force_valid_ss 调用（SD-50）。帧所在内存不可读时的去向见 CORE-USER-RETURN-SIGNAL-09::RS-06（读帧没有容错）与 CORE-USER-RETURN-SIGNAL-09::RS-07（badframe 只返回 0）。', 'restore_sigcontext 把 sc 中的 cx、sp、ip、r11 原样写进帧，cs、ss 取 sc 值或上 3，flags 只按 FIX_EFLAGS 取用户位（SD-49、AD3-09、AD3-10），FIX_EFLAGS 含 TF 与 RF（QD-63）。这些正是 do_syscall_64 中 SYSRET 适用性判断读取的字段：cx 与 ip、r11 与 flags、cs 与 ss、ip 上界、flags 的 RF/TF（SD-08、CORE-USER-BOUNDARIES-07::SB-16）；sp 不在判断之列（SD-09）。sigcontext_64 中 cs、ss 是 __u16（QD-65），能写入任意 64 位值的是 ip、sp、cx、r11 等通用寄存器字段。', '这些写入原样到达判断与返回段，需要三个前提。(a) 该次出口没有成功建立信号帧：get_signal 为假，或建帧失败。建帧失败时 x64_setup_rt_frame 在改写寄存器之前返回，例如没有 SA_RESTORER 时在 168-169 行返回（AD3-12；CORE-USER-RETURN-SIGNAL-09::RS-01、CORE-USER-RETURN-SIGNAL-09::RS-02）。建帧成功时，x64_setup_rt_frame 改写 ax、ip、sp、cs（SD-47），ss 不等于 __USER_DS 时调用 force_valid_ss（SD-38），handle_signal 还清掉 DF、RF、TF（SD-51），TF/RF 与 cs 两项不适用条件随之消失，ip 改由 sa_handler 决定。(b) 帧地址通过 access_ok，且帧所在内存可读。(c) restore_sigcontext 把 orig_ax 置为 -1（AD0-11），所以这次出口的重启 switch 不改写恢复值。', '在上述前提下，经 rt_sigreturn 写入的值原样到达 do_syscall_64 的判断。判断返回的 bool 不被入口汇编检查（CORE-USER-BOUNDARIES-07::SB-01、CORE-USER-BOUNDARIES-07::SB-16），按调用约定它在 %rax 中，随后被 POP_REGS 的 popq %rax 覆盖（QD-58；推断）。本仓库 do_syscall_64 自己的注释写明不适用时应改走 IRET 退出路径（AD3-01），入口汇编中没有对应分支，返回一律走 sysretq。在 SYSRET 判断涉及的字段中，返回段只消费 flags 与 ip（sp 另经 popq %rsp 装入，ax 等其余通用寄存器另经 POP_REGS 装入）：187-192 行的六次 xchg 把它们换进 R11、RCX 槽，193 行 POP_REGS 再装入 r11、rcx（CORE-USER-BOUNDARIES-07::SB-02、QD-58）；addq $0x28 跳过的五格是 irq_nr、orig_ax、RIP 槽（此时存 sc.cx）、CS 槽、EFLAGS 槽（此时存 sc.r11），SS 槽在 popq %rsp 取 SP 槽之后不再被读取（CORE-USER-BOUNDARIES-07::FP-3、CORE-USER-BOUNDARIES-07::VT-PTREGS）。所以恢复出的 cs、ss 对返回没有作用，sc.cx、sc.r11 也回不到用户寄存器。', 信号投递只经 syscall_exit_to_user_mode：它的活动调用点只有 do_syscall_64 与 ret_from_fork，__syscall_exit_to_user_mode_work、exit_to_user_mode_loop、arch_do_signal_or_restart 各只有一个活动调用点（QD-61、QD-62）；中断与异常返回经 excep_hwint_context，它不调用这些函数（SD-52）。推断：信号只在系统调用出口投递，此时帧中的 cx、r11 本来就是 syscall 指令占用的值，sc.cx、sc.r11 回不到用户寄存器的影响有限。]
