  note: 只追加相交证据，原条目与状态不改，不构成修复授权。这里补越界号与返回尾部重启逻辑的交互：根因与 UB-09 第二个边角相同（入口没有把 ax 预置为 -ENOSYS，CORE-USER-SYSCALL-STDIO-08::AS2-03、CORE-USER-SYSCALL-STDIO-08::QS-18），重启判定对四个 64 位值把用户 rax 当作 ERESTART 码。07 把 arch_do_signal_or_restart 内部列为 not_covered（CORE-USER-BOUNDARIES-07::entry.syscall_frame_return），08 也把信号处理内部列为 not_covered（CORE-USER-SYSCALL-STDIO-08::entry.syscall_dispatch），所以这是两包覆盖范围之外的新交互。UB-09 中“返回的是原 rax（即系统调用号）”“用户得到原系统调用号作为返回值”的说法由 CORE-USER-RETURN-SIGNAL-09::ER-03 限定；08 中同义的正面表述按 SR08-02 处置（CORE-USER-RETURN-SIGNAL-09::ER-02）；-516 写回 219 的主述在 CORE-USER-RETURN-SIGNAL-09::RS-05。严重度低：只能由调用者自己触发；正常的 libc 不会以这四个值作系统调用号（libc 在仓库外，未核，CORE-USER-VFS-BASELINE-05::GAP-U10）；-516 一支若到达 while (1)（推断），与直接发 219 号相同，不带来新能力。回到 ip-2 处再次执行 syscall 指令、反复进出内核、以 219 停在 while (1)，都依赖 sysretq 以 rcx 返回且 ip-2 处为 2 字节 syscall 指令（ISA 外部语义，CORE-USER-BOUNDARIES-07::NVB-4、本包 NVR-3），运行时是否如此属 NOT_RUN（本包 NVR-1）；用户程序或 libc 是否以这四个值发出系统调用见 CORE-USER-VFS-BASELINE-05::GAP-U10（本包 NVR-4）。本追加不断言运行时后果，UB-09 的 kind 与 future_verification 不因本追加改变（见 CORE-USER-RETURN-SIGNAL-09::ER-03）。
  added_facts: ['号按 (uint)(int)eax 不小于 453 时，do_syscall_64 不写 regs->ax，帧中 ax 与 orig_ax 都是入口压入的完整 64 位 rax（CORE-USER-SYSCALL-STDIO-08::AS2-02、CORE-USER-SYSCALL-STDIO-08::AS2-04、CORE-USER-SYSCALL-STDIO-08::AS2-05；PUSH_REGS 宏体中的 pushq %rax 与入口的 orig_ax 压栈见 QD-59）。随后 syscall_exit_to_user_mode → __syscall_exit_to_user_mode_work → exit_to_user_mode_loop 无条件调用 arch_do_signal_or_restart（QD-61；CORE-USER-BOUNDARIES-07::SB-14、CORE-USER-BOUNDARIES-07::SB-15），这一段没有改写 regs 字段的语句（QD-60），get_signal 也不接收 regs（AD0-08）。', 重启判定把这个 rax 当作错误码。syscall_get_nr 返回 int 化的 orig_ax（AD0-01；GCC 取低 32 位，推断），对 -512、-513、-514、-516 都不等于 -1。syscall_get_error 取 regs->ax（SD-45），IS_ERR_VALUE 为真时原样返回（AD0-03）。按 MyOS2 自己的 err.h，IS_ERR_VALUE 判断 (size_t)x >= (size_t)-MAX_ERRNO，MAX_ERRNO 为 4095（AD0-18、QD-57），四个值都满足；IA32 符号扩展块因 CONFIG_IA32_EMULATION 未定义而不编入（QD-48、QD-49）。ERESTARTSYS、ERESTARTNOINTR、ERESTARTNOHAND、ERESTART_RESTARTBLOCK 依次为 512、513、514、516（QD-57）。, '没有处理函数时（get_signal 为假）：-512、-513、-514 时 regs->ax = regs->orig_ax（写回同一个值），regs->ip -= 2（AD3-07、AD0-10）；-516 时 regs->ax = 219，regs->ip -= 2（AD1-09、AD3-05、AD0-04；219 没有表项，QD-46，主述见 CORE-USER-RETURN-SIGNAL-09::RS-05）。这些是源码层面对帧的改写。get_signal 为假包括没有可出队的信号（AD3-17、AD3-19），也包括出队的信号只有 SIG_IGN 或 SIG_DFL 动作：默认致命动作只置 PF_SIGNALED，循环继续取下一个信号（CORE-USER-RETURN-SIGNAL-09::RS-03）。', '返回段把改写后的 regs->ip、regs->ax 装入 rcx、rax：六次 xchg 把 ip 换进 RCX 槽，POP_REGS 的 popq %rcx、popq %rax 装入（CORE-USER-BOUNDARIES-07::SB-02、QD-58）。推断（ISA 语义未核，NOT_RUN）：用户态回到 ip-2 处的 syscall 指令，带着改写后的 rax 再次进入。对 -512、-513、-514，只要此后每次返回都没有投递用户处理函数，任务就停在这条指令上反复进出内核；之后若投递处理函数，-514 以及不带 SA_RESTART 的 -512 得到 -EINTR 并离开循环，-513 以及带 SA_RESTART 的 -512 经处理函数后仍回到循环。-516 一支第二次进入时按 219 分派，停在内核态 while (1)，不再经过信号处理（CORE-USER-SYSCALL-STDIO-08::AS2-08、CORE-USER-SYSCALL-STDIO-08::AS2-06）。', '有处理函数时（get_signal 为真），handle_signal 在建帧之前按重启表改写（CORE-USER-RETURN-SIGNAL-09::RS-02）：-514、-516 以及不带 SA_RESTART 的 -512 得到 regs->ax = -EINTR，ip 不变（AD0-05、AD0-06）；-513 以及带 SA_RESTART 的 -512 得到 ax = orig_ax、ip -= 2（AD3-04）。建帧成功时，改写后的 ax、ip 先存入信号帧（SD-46），随后 x64_setup_rt_frame 改写 ax、ip 等交给处理函数（SD-47）；rt_sigreturn 从帧恢复 ax、ip（AD3-09），并把 orig_ax 置 -1（AD0-11），所以它自己的出口跳过重启 switch，最后 return regs->ax（signal_64.c:272（QD-L10））。因此，若处理函数经 restorer 发出 rt_sigreturn 且没有改动帧（用户态行为，推断），-EINTR 成为这次调用在帧中的返回值；ax 为原值、ip-2 的一支经 rt_sigreturn 回到 ip-2（推断：再次进入同一循环）。建帧失败时改写不回滚，直接带回（CORE-USER-RETURN-SIGNAL-09::RS-02；CORE-USER-RETURN-SIGNAL-09::RS-01 若成立，所有处理函数投递都会失败）。', '源码层面只改写调用者自己的 pt_regs，改写内容取决于该次出口 get_signal 的真假（为假的范围见第 3 项；为真时不论建帧成败，都先按第 5 项改写，见 CORE-USER-RETURN-SIGNAL-09::RS-02）。-516 一支：第一次出口 get_signal 为假时，ax 改为 219、ip 减 2，推断以 219 再次进入后停在 __x64_sys_ni_syscall 的内核态 while (1)；为真时得到 -EINTR、ip 不变，不写 219。-512、-513、-514 一支：get_signal 为假时，ax 写回同一个值、ip 减 2，推断只要此后每次出口 get_signal 都为假，任务就反复进出内核；某次出口 get_signal 为真时，-514 与不带 SA_RESTART 的 -512 得到 -EINTR，推断离开循环，-513 与带 SA_RESTART 的 -512 仍得到 ip 减 2，推断回到循环。以上“再次进入、停住、反复进出、离开”都是按 ISA 语义的推断（NOT_RUN，NVR-3、NVR-1）。同一 CPU 上其他任务能否继续运行，取决于中断返回处的调度：excep_hwint_context 在 !in_atomic() 时调用 schedule()（AD3-14）；外部中断是否都经过这里、in_atomic() 在这些路径上的取值都未核；此外，每次出口 get_signal 放 siglock 时 raw_spin_unlock_irq 调用 preempt_enable，计数减到 0 时可能调用 preempt_schedule（D01.5，SD-26、QD-25），何时为真也未追；对其他任务的影响未分析。']
