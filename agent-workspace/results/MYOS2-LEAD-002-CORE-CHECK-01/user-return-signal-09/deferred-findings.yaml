  impact: 当前（源码层面）：每个系统调用返回，以及每个 fork 子任务第一次返回，都会无门禁地执行一遍 get_signal，并对 siglock 加锁、解锁。这把锁在全体经 fork 产生的任务之间共享（CORE-USER-VFS-BASELINE-05::UV-14；后果见 CORE-USER-RETURN-SIGNAL-09::RS-12）。TIF_SIGPENDING 没有可达的置位路径，TIF_NOTIFY_SIGNAL 没有置位语句，初值为 0，所以推断 signal_pending() 恒为假。潜在（现有活动等待路径都不受影响）：msleep_interruptible、down_interruptible、down_killable、down_timeout 等等待入口在 mykernel 中没有活动调用者，只有定义、声明和注释（QD-172）；wait_for_common 的唯一活动调用者 wait_for_completion 传 TASK_UNINTERRUPTIBLE（QD-173）；对不含 TASK_INTERRUPTIBLE、TASK_WAKEKILL 的状态，signal_pending_state 在 signal.h:501 直接返回 0，不读 TIF 位（QD-174）。将来若出现会检查信号的可中断等待（经 signal_pending 或 signal_pending_state 判断；现有以 TASK_INTERRUPTIBLE 睡眠的 kthreadd、devtmpfsd 与三个请求线程都不检查，QD-223、QD-225）：只恢复置位端而出队侧仍不重算时，get_signal 取空 pending 后该位会一直保持，这类等待会一直被判为有信号；只恢复两处门禁而不恢复置位端时，信号永远不会被取出（推断）。对 CORE-USER-BOUNDARIES-07::UB-06 所述的清零帧情形，会在零帧上执行 get_signal 与 arch_do_signal_or_restart（未追）。
