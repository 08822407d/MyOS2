  capabilities: [ipc.signal.signal_selection, ipc.signal.syscall_restart]
  claim: 'get_signal 每轮先出队，再按动作表分流。出队会删除信号：collect_signal 在 :183 清除 pending 位（signal.c:183（QD-L31））；同号信号排了多份时位保留，下一轮再取一份。分流时，活动正文只有 3 处 continue（SIG_IGN、默认忽略、SIGNAL_UNKILLABLE 且不是 kernel-only）和 2 处 break（两个出队函数都返回 0、装有处理函数）（SD-104、SD-105）。其余 SIG_DFL 信号都落到 fatal: 标签。停止分支（:968-1000）、核心转储（:1012-1025）和 do_group_exit（:1039）都在 // 注释中，活动正文里没有退出、停止或核心转储调用（SD-103）；唯一的活动语句是 :1010 的 current->flags |= PF_SIGNALED（signal.c:1010（QD-L31）），其后没有 break（SD-105），回到 for(;;) 继续出队，循环之后才在 signal.c:1042（QD-L31） 解锁。落到这里的有 SIGKILL、SIGTERM、SIGINT、SIGQUIT、SIGSEGV、SIGSTOP/SIGTSTP/SIGTTIN/SIGTTOU，以及 32 号起的实时信号：siginmask 要求 sig < SIGRTMIN（值为 32），所以实时信号永远不属于默认忽略（QD-182）。PF_SIGNALED 在全仓库只有定义和这一处写入，没有读取者（QD-178）。按名检索，也没有别的活动路径会因信号让任务退出：do_exit 的活动调用只有 do_group_exit（exit.c:219）、kthread.c:139 和 exit 系统调用（sched/syscall.c:72），fatal_signal_pending 只在 signal.h 的辅助函数里用到（QD-180）。信号被消耗后，get_signal 接着取下一个：之后若没有装处理函数的信号，返回 false，arch_do_signal_or_restart 走与“没有任何信号”相同的分支（arch signal.c:255-270）；若取到装有处理函数的信号，返回 true，进入 handle_signal（AD0-08）。那个分支的进入条件是 syscall_get_nr(current, regs) != -1，syscall_get_nr 返回 int 化的 orig_ax（QD-184、AD0-01）；系统调用返回时 orig_ax 是入口 rax（rt_sigreturn 除外，它把 orig_ax 置为 -1），低 32 位为 0xFFFFFFFF 的越界调用例外（推断：GCC 取低 32 位）。进入后，switch 只在 regs->ax 恰好是 -ERESTARTNOHAND、-ERESTARTSYS、-ERESTARTNOINTR、-ERESTART_RESTARTBLOCK 之一时才改写帧（AD1-07）。所以是否重启由 ax 决定，不由致命信号本身决定。'
  premises: ['信号已进入目标任务的私有或共享 pending，且不在其 blocked 中。当前唯一的活动发送链是 sys_kill（lock_IPC/syscall.c:99）→ kill_something_info → kill_proc_info → group_send_sig_info → send_signal_locked → __send_signal_locked（QD-190），只处理 pid > 0；pid <= 0 时 kill_something_info 在 :766 原地 while (1)（QD-189）。写哪个 pending 由 kill_proc_info 中固定的 PIDTYPE_TGID 决定（signal.c:725），经 :733 → :682 → :660 到 :497 选中共享 pending；lock_IPC/syscall.c:97 的 PIDTYPE_TGID 只交给 prepare_kill_siginfo 决定 si_code（:1079 得 SI_USER）（QD-191）。', '对应表项的 sa_handler 为 SIG_DFL。这是全系统条件，不是单个进程的条件：经 fork 产生的任务共用 init_sighand 的动作表（CORE-USER-VFS-BASELINE-05::UV-14，后果见 CORE-USER-RETURN-SIGNAL-09::RS-12），初值为 SIG_DFL；任何一个任务用 rt_sigaction 改了某个可捕获信号，所有任务上该信号会不会走到 :1010 都随之改变。SIGKILL、SIGSTOP 恒为 SIG_DFL：init_sighand 初值为 SIG_DFL，do_sigaction 拒绝修改 kernel-only 信号（QD-187），ignore_signals、flush_signal_handlers 都只在注释中（QD-186）。仓库内的活动用户程序没有安装处理函数：唯一的 signal(SIGTERM, …) 在 test_all 中，而 test_all 的唯一调用 myshell.c:81 是注释（QD-188）；libc 内部属 CORE-USER-VFS-BASELINE-05::GAP-U10。', 'get_signal 被调用：只在目标任务下一次经 syscall_exit_to_user_mode 返回时，即系统调用返回或 fork 子任务第一次返回（CORE-USER-BOUNDARIES-07::QB-43；门禁被注释的情况见 CORE-USER-RETURN-SIGNAL-09::RS-04）。首个程序经 kjmp_to_doexecve 进入用户态那一次不经过这一步（CORE-USER-BOUNDARIES-07::FP-1）。']
  impact: 源码层面：发给普通进程的 SIGKILL、SIGTERM、SIGINT 等默认致命信号不会结束进程，停止类信号不会让进程停止，信号只是被静默消耗。消耗发生在目标任务下一次经 syscall_exit_to_user_mode 返回时；发送端也不唤醒目标，因为 complete_signal 的唯一调用 signal.c:597 被注释（QD-167）。1 号任务例外：copy_process 对 is_child_reaper 为真（pid 号为 1）的线程组首任务置 SIGNAL_UNKILLABLE（is_child_reaper 分支 fork.c:1321（QD-L39），置位在下一行 fork.c:1322），这是该标志唯一的置位点（QD-181）；copy_signal 为每个新进程新建清零的 signal_s（QD-202），所以推断只有 1 号任务带这个位。它收到的 SIGTERM、SIGINT、SIGQUIT、SIGSEGV、SIGTSTP、SIGTTIN、SIGTTOU 和实时信号在 :964-966 直接 continue，同样被静默丢弃，到不了 :1010；只有 SIGKILL、SIGSTOP 到达 :1010（signal.c:964（QD-L31））。父任务方面：即使将来接上 do_group_exit，父任务能否看到“因信号终止”的状态仍受 CORE-USER-VFS-BASELINE-05::UV-15、CORE-USER-VFS-BASELINE-05::LBU-01 限制（wait4 为空、exit_notify 不通知父任务），这不是本条造成的。重启方面：返回时若 regs->ax 恰好是四个 ERESTART 码之一，arch_do_signal_or_restart 会设 ax=orig_ax、ip-=2，-ERESTART_RESTARTBLOCK 时写回 219（见 CORE-USER-RETURN-SIGNAL-09::RS-05）。在 mykernel 中按名检索，活动代码显式产生这些码的只有两处：completion.h:52（受 signal_pending_state 门控，按 RS-04 推断不进入）和没有调用者的 restart_syscall()（signal.h:464）（QD-183、QD-169）。另有两类来源：号不小于 453 的越界号路径把原号留在 ax（CORE-USER-BOUNDARIES-07::UB-09）；没有活动 return 的处理函数（dup、dup2、wait4，见 CORE-USER-BOUNDARIES-07::UB-10、CORE-USER-VFS-BASELINE-05::UV-15）的返回值在 C 语义下未定义，静态阅读不能排除它们等于这些码。rt_sigreturn 不在此列：restore_sigcontext 把 orig_ax 置为 -1（QD-185），重启分支不进入。以上只描述源码分支，不断言运行结果。
