    的三个字段、fpstate、oldmask）与 uc_sigmask；SA_SIGINFO 时经 copy_siginfo_to_user 写 siginfo。最后设 di=信号号、ax=0、si、dx 指向帧内 info 与 uc、ip=sa_handler、sp=frame、cs=__USER_CS，ss 必要时修正；handle_signal 在成功后清
    DF、RF、TF。
  failure_path: 缺 SA_RESTORER 时在 169 行返回 -EFAULT，若 RS-01 成立则对经 rt_sigaction 安装的处理函数恒如此；失败无人处理（RS-02）。门能通过时：主体写入没有地址检查（RS-08）、uc_flags 未初始化（RS-09）、不保存 FPU 而 fpstate 非零（RS-10）。trapno、err、cr2
    没有写入者、旧式栈切换分支恒不进入，均为事实记录。
