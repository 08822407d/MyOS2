    不被使用，没有 IRET 后备（CORE-USER-BOUNDARIES-07::UB-09；rt_sigreturn 能把用户帧的值写进被检查字段，已作为证据追加到 UB-09）。分派不返回时（表内缺项的 while (1)，或重启写回 219 后再次进入，后者属推断，RS-05）到不了返回尾。有处理函数时，建帧失败不回滚 ax/ip 改写，已出队的信号丢失（RS-02）；按
