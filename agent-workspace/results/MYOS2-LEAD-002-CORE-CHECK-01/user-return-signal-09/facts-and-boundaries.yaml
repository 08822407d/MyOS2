  normal_path: do_syscall_64 在 (uint)nr < 453 时把 x64_sys_call 的返回值写入 regs->ax（CORE-USER-SYSCALL-STDIO-08::AS2-05），然后在 if 块之外调用 syscall_exit_to_user_mode(regs)。后者唯一的活动语句是 __syscall_exit_to_user_mode_work(regs)；再下一层唯一的活动语句是
    exit_to_user_mode_loop(regs, 0)；循环函数只有两条活动语句：无条件的 arch_do_signal_or_restart(regs) 与 return ti_work。arch_do_signal_or_restart 中，get_signal 为真时由 handle_signal 先按重启表改 ax/ip，再建信号帧，建帧成功时改
    di、si、dx、ax、ip、sp、cs，必要时经 force_valid_ss 改 ss，并清 flags 的 DF、RF、TF，建帧失败时只留下重启改写（RS-02）；为假时在 (int)orig_ax ≠ -1 且 ax 为 ERESTART 码时改 ax/ip。三层逐级返回，返回值无人接。do_syscall_64 随后读 cx、ip、r11、flags、cs、ss
    算出 SYSRET 适用性 bool；entry_SYSCALL_64 不检查它，按位置落入 syscall_return_via_sysret（CORE-USER-BOUNDARIES-07::SB-01）。ret_from_fork 在 79 行调用同一个 syscall_exit_to_user_mode，之后 ret_from_fork_asm
    只对用户子任务（rbx 为 0）jmp 到同一返回段，内核线程转到 1:，经 callq 后停在 297 行的 jmp .（CORE-USER-BOUNDARIES-07::FP-2、CORE-USER-BOUNDARIES-07::SB-03），这条路径没有 SYSRET 判断。
