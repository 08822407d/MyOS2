- id: ipc.signal.sigreturn_restore
  id_status: proposed_id
  theme: D02
  refines: null
  purpose: rt_sigreturn（15）与 restore_sigcontext：从用户帧恢复阻塞掩码与寄存器。
  entries:
  - mykernel/arch/x86_64/lock_IPC/signal/signal_64.c::sys_rt_sigreturn
  - mykernel/arch/x86_64/lock_IPC/signal/signal_64.c::restore_sigcontext
  normal_path: 用 current_pt_regs() 取入口帧，帧地址为 regs->sp-8，过 access_ok 后用 get_user 读 uc_sigmask、uc_flags；先 set_current_blocked 写回掩码（去掉 SIGKILL、SIGSTOP），再由 restore_sigcontext 用 copy_from_user
