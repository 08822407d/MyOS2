- id: ipc.signal.syscall_restart
  id_status: proposed_id
  theme: D03
  refines: null
  purpose: 系统调用返回尾部的重启判定：按 (int)orig_ax 与 syscall_get_error(ax) 改写 regs->ax、regs->ip。有 handler 的 switch 在 handle_signal 中（先于建帧），无 handler 的 switch 在 arch_do_signal_or_restart 中，重启号由
    get_nr_restart_syscall 给出。
  entries:
  - mykernel/arch/x86_64/lock_IPC/signal/signal.c::handle_signal
  - mykernel/arch/x86_64/lock_IPC/signal/signal.c::arch_do_signal_or_restart
  - mykernel/arch/x86_64/lock_IPC/signal/signal.c::get_nr_restart_syscall
  - mykernel/arch/x86_64/include/asm/syscall.h::syscall_get_nr
  - mykernel/arch/x86_64/include/asm/syscall.h::syscall_get_error
  normal_path: 每次经 syscall_exit_to_user_mode 返回时，arch_do_signal_or_restart 都会运行（D01；CORE-USER-BOUNDARIES-07::SB-14、SB-15）。get_signal 为真时，handle_signal 先判断 (int)orig_ax != -1，再按 syscall_get_error
    的结果改写：-516、-514 与不带 SA_RESTART 的 -512 改为 -EINTR；-513 与带 SA_RESTART 的 -512 改为 ax = orig_ax、ip -= 2；随后建帧：建帧成功时，改写后的 ax、ip 先存入用户帧，要到 rt_sigreturn 恢复后才回到 pt_regs（RR-02～RR-08）；建帧失败时改写不回滚，留在
    pt_regs，由这次返回段装入（RR-09，RS-02）。get_signal 为假时，同一判断下 -514、-512、-513 改为 ax = orig_ax、ip -= 2，-516 改为 ax = 219、ip -= 2（RR-10～RR-13）。其余值不变（两个 switch 都没有 default）。改写后的 ax、ip 由返回段装入 rax、rcx（推断）。
  failure_path: 219 在活动表中没有表项，推断再次进入时落到 __x64_sys_ni_syscall 的 while (1)（RS-05，ED-17）。有 handler 时建帧失败不回滚改写，已出队信号丢失（RS-02；若 RS-01 成立，经 rt_sigaction 注册的 handler 全部如此）。默认致命动作的信号被消耗后走无 handler
    分支（RS-03）。ia32、x32 分支与 restart_block 续做未实现（RR-15～RR-17）。能由源码确定构造、把重启码留在 regs->ax 的已知途径只有越界号（推断；对 CORE-USER-BOUNDARIES-07::UB-09 的证据追加与 ER-03）；没有活动 return 的处理函数的返回值不能排除。
  unknown:
  - ip -= 2 之后用户态是否回到一条 2 字节的 syscall 指令、是否再次执行、再次执行是否成功（ISA 语义与运行时，NOT_RUN；NVR-3、NVR-1）
  - 没有活动 return 的处理函数（wait4、dup、dup2，以及 lseek 可达的 blkdev_llseek、dcache_dir_lseek）写进 ax 的值能否恰为 -512、-513、-514、-516（C 语义未定义）
  - (int)orig_ax 的转换按 GCC 取低 32 位理解（实现定义，推断）
  - SA_RESTART 位在 do_sigaction 掩码后保留（推断，未经预处理核实；NVR-2 可一并确认）
  not_covered:
