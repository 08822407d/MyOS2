- id: SR08-02
  verdict: accept
  summary: 接受。08 把分派后的 regs->ax 写成了用户最终拿到的 rax。源码分四段：分派前 orig_ax 与 ax 都是入口的完整 64 位 rax；分派只在 (uint)(int)eax < 453 且处理函数返回时写 ax（号检查只看 movslq 之后、以 int 接收的 eax）；返回尾部无条件调用 arch_do_signal_or_restart，没有信号且
    (int)orig_ax ≠ -1 时 -512/-513/-514 改为 orig_ax、-516 改为 219 并令 ip 减 2，有信号时 handle_signal 先按重启表改写，帧建立成功再改 di、ax（为 0）、si、dx、ip、sp、cs、必要时 ss 并清 DF/RF/TF，rt_sigreturn 则在分派阶段、restore_sigcontext
    成功时由用户帧恢复 15 个通用寄存器与 sp、ip（cs、ss 取用户值或上 3，flags 只取 FIX_EFLAGS 所列的位）并把 orig_ax 置 -1；返回段装入 rax 的是这之后帧中的 ax。“rax 等于分派值”的充分条件是四条同时成立：号在表内且处理函数返回、没有信号递送（get_signal 为假）、没有重启改写（(int)orig_ax
    为 -1，或分派值不是 -512/-513/-514/-516）、正常到达 syscall_return_via_sysret；它不是必要条件。以“返回尾部不写帧并到达返回段”为准，第 1、3、4 条必要；第 2 条不必要，可以放宽为“没有成功建立信号帧（get_signal 为假，或建帧在改写寄存器之前失败）”，放宽后四条合起来是充要条件。越界号时第
    1 条换成“分派不写 ax，控制到达返回尾部”，分派值换成入口的 64 位 rax；只比数值时另有三种数值相等而帧已改写的情形，不算未改写返回（全文见 user-return-signal.md“衔接”一节 L2；简述见 stdio-08-disposition.md §3.3）。越界号的 64 位 rax 恰为 -512/-513/-514/-516
    时，没有信号也会改写帧，四种都令 ip 减 2，-512/-513/-514 的 ax 写回同值（-516 把 ax 改为 219 是源码事实，原地循环是 ISA 推断）。08 中 20 处位置，18 处需附注，更正登记为 CORE-USER-RETURN-SIGNAL-09::ER-02；07 的 CORE-USER-BOUNDARIES-07::UB-09
    有同一说法，标记为由 CORE-USER-RETURN-SIGNAL-09::ER-03 处理。sysretq 之后用户态实际看到什么属 NOT_RUN。
