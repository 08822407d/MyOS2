value_tables:
- id: VT-RESTART
  type: defines
  purpose: 重启相关常量与分派表成员由源码文本重算：ERESTART* 与 EINTR 的值、SA_RESTART/SA_RESTORER 位、重启号与几个信号相关号，以及这些号在 syscalls_64.h 活动表中有没有表项
  defines:
    ERESTARTSYS: mykernel/include/linux/lib/errno.h
    ERESTARTNOINTR: mykernel/include/linux/lib/errno.h
    ERESTARTNOHAND: mykernel/include/linux/lib/errno.h
    ERESTART_RESTARTBLOCK: mykernel/include/linux/lib/errno.h
    SA_RESTART: mykernel/include/uapi/asm-generic/signal-defs.h
    SA_RESTORER: mykernel/arch/x86_64/include/asm/signal.h
    __NR_restart_syscall: mykernel/arch/x86_64/include/asm/unistd_64.h
    __NR_rt_sigreturn: mykernel/arch/x86_64/include/asm/unistd_64.h
    EINTR: mykernel/include/uapi/asm-generic/errno-base.h
    MAX_ERRNO: mykernel/include/linux/kernel/err.h
    __NR_syscalls: mykernel/arch/x86_64/include/asm/unistd_64.h
  table_membership:
  - __NR_restart_syscall
  - __NR_rt_sigreturn
  - __NR_rt_sigaction
  - __NR_rt_sigprocmask
  assumptions:
  - '只取 #define 的字面数值；SA_RESTORER 的值来自 asm/signal.h，它在 signal.c 翻译单元中是否先于 UAPI_SA_FLAGS 的展开可见是 RS-01 的推断前提，本表不判定'
  - 表成员按 syscalls_64.h 活动行的 __SYSCALL(__NR_x, …) 文本比对
  values:
    ERESTARTSYS: 512
    ERESTARTNOINTR: 513
    ERESTARTNOHAND: 514
    ERESTART_RESTARTBLOCK: 516
    SA_RESTART: 268435456
    SA_RESTORER: 67108864
    __NR_restart_syscall: 219
    __NR_rt_sigreturn: 15
    EINTR: 4
    MAX_ERRNO: 4095
    __NR_syscalls: 453
    in_active_table:__NR_restart_syscall: false
    in_active_table:__NR_rt_sigreturn: true
    in_active_table:__NR_rt_sigaction: true
    in_active_table:__NR_rt_sigprocmask: true
