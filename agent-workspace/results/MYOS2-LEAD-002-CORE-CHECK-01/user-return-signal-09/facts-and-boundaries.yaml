  - mykernel/arch/x86_64/include/asm/uaccess.h::get_user
  - mykernel/arch/x86_64/include/asm/uaccess.h::put_user
  - mykernel/arch/x86_64/include/asm/uaccess.h::unsafe_put_user
  normal_path: copy_from_user 与 copy_to_user 都落到 copy_user_generic（stac、rep movsb 或替换调用、clac，并登记异常表项）；copy_to_user 先过 access_ok，copy_from_user 不过。access_ok 用 x86 版 __access_ok：__builtin_constant_p(size
    <= PAGE_SIZE) 为真且 size <= PAGE_SIZE 时只看起始地址的符号位，否则看起始地址加长度后是否仍非负且不回绕；走哪一支源码上不能确定（推断，见 RS-07）。get_user、put_user 是对指针的直接读写，表达式值恒为 -ENOERR（0）；unsafe_put_user 展开为 put_user，其 goto 分支不可达；user_access_begin
    没有活动定义。
  failure_path: copy_from_user 不做 access_ok（RS-11）；异常表只有生产者没有消费者，get_user、put_user 永不报错；内核里访问无效用户地址时没有 -EFAULT 出口，按地址落到 myos_bad_area、do_kern_addr_fault 或 excep_gen_prot 的 while (1)（CORE-MM-BASELINE-04::MC-23，推断依赖硬件语义）；地址小于
    TASK_SIZE_MAX 而落在某个 VMA 内时，缺页交给 myos_handle_mm_fault，结果非 0 时在 do_user_addr_fault 中自旋，为 0 时之后的去向未追。
