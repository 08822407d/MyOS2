gap_status:
- id: GAP-U04
  qualified_id: CORE-USER-VFS-BASELINE-05::GAP-U04
  original: syscall_return_via_sysret、ret_from_fork 与 pt_regs 内容（首个程序进入用户态与子任务返回时的寄存器来源）未追
  coverage: 07 已收窄为“三条路径的写帧与消费已清楚，生成偏移与硬件语义未核”。本批只追加分派与返回段之间的静态证据：返回尾对帧的全部改写点（重启的 ax/ip，投递的 ax/di/si/dx/ip/sp/cs/flags 与可能的 ss）、分派阶段 rt_sigreturn 的寄存器恢复（不含 irq_nr，flags 只取 FIX_EFLAGS
    位）及其进入返回段的方式。
  evidence:
  - QD-43
  - AD1-10
  - AD3-09
  - CORE-USER-BOUNDARIES-07::AB2-16
  - CORE-USER-BOUNDARIES-07::SB-02
  - SD-37
  - SD-39
  closed_static_parts:
  - 分派与返回段之间对帧的改写点逐项定位（return_frame_transitions、restart_conditions、frame_fields）
  - rt_sigreturn 成功后 orig_ax 为 -1，同一出口的两处重启 switch 都跳过（RR-01）；同一出口 get_signal 为假，或建帧失败（x64_setup_rt_frame 在改写寄存器之前返回负值）时，恢复出的 ip、sp 与按 FIX_EFLAGS 合并后的 flags（只有 FIX_EFLAGS 所列的位取自用户帧）原样到达返回段（AD1-10、ED-18）；同一出口建帧成功时，它们先存入新信号帧，ip、sp
    被改为 sa_handler 与帧地址，flags 清掉 DF、RF、TF（RT-12、RT-13、RT-17）
  remaining_unknown:
  - sysretq、swapgs、sti 的硬件语义与 ip-2 是否正对 2 字节 syscall 指令（NVR-3）
  - 生成偏移的数值（07 NVB-3）
  - 运行时寄存器值（NOT_RUN，NVR-1）
  status_from: narrowed
  status_to: narrowed
  runtime: NOT_RUN
  related:
  - CORE-USER-BOUNDARIES-07::GAP-U04
  - CORE-USER-BOUNDARIES-07::NVB-4
- id: GAP-U10
  qualified_id: CORE-USER-VFS-BASELINE-05::GAP-U10
  original: 用户程序所用 musl 的系统调用选择（fork、exit_group、open 等）只按常识推断，未读 musl 源码
  coverage: 本批不读也不推断 libc。信号路径只到内核接口为止：handler 与 restorer 都是用户登记的指针，内核不检查也不调用 restorer 的内容。
  evidence:
  - CORE-USER-SYSCALL-STDIO-08::AS1-01
  - CORE-USER-SYSCALL-STDIO-08::QS-04
  closed_static_parts: []
  remaining_unknown:
  - libc 是否经 rt_sigaction 注册 handler、是否带 SA_RESTORER/SA_RESTART、restorer 是哪段代码（仓库外）
  - libc 是否会以 -512/-513/-514/-516 这样的值作为系统调用号发出（仓库外）
  status_from: open
  status_to: open
  runtime: NOT_RUN
  related:
  - CORE-USER-SYSCALL-STDIO-08::GAP-U10
  - CORE-USER-BOUNDARIES-07::GAP-U10
