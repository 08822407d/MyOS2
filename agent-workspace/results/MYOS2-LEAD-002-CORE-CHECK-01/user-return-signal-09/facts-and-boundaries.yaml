  symbol: arch_do_signal_or_restart
  kind: in_body
  lines:
  - 254
  - 257
  quote: "\t/* Did we come from a system call? */\n\tif (syscall_get_nr(current, regs) != -1) {\n\t\t/* Restart the system call - no handlers present */\n\t\tswitch (syscall_get_error(current,\
    \ regs)) {"
  cpp_conditions: []
  role: 无处理函数分支的进入条件：syscall_get_nr 返回 int 化的 orig_ax（AD0-01），只有它不等于 -1，才按 syscall_get_error 的结果进入重启 switch
- id: AD3-08
  theme: D03
  path: mykernel/arch/x86_64/lock_IPC/signal/signal_64.c
  symbol: restore_sigcontext
  kind: in_body
  lines:
  - 56
  - 57
  quote: "\tif (copy_from_user(&sc, usc, offsetof(sigctx_s, reserved1)))\n\t\treturn false;"
  cpp_conditions: []
  role: restore_sigcontext 只检查 copy_from_user 的返回值，非 0 时返回 false，由 rt_sigreturn 转 badframe；它不另查帧地址，地址范围只由 rt_sigreturn 的 access_ok 检查（AD3-13）
- id: AD3-09
  theme: D03
  path: mykernel/arch/x86_64/lock_IPC/signal/signal_64.c
  symbol: restore_sigcontext
  kind: in_body
  lines:
  - 65
  - 67
  quote: "\tregs->ax = sc.ax;\n\tregs->sp = sc.sp;\n\tregs->ip = sc.ip;"
  cpp_conditions: []
  role: restore_sigcontext 把从用户帧复制到局部变量 sc 的 ax、sp、ip 原样写回 regs，不检查取值；同函数 59–75 行共写回 15 个通用寄存器与 sp、ip（SD-20）
- id: AD3-10
  theme: D03
  path: mykernel/arch/x86_64/lock_IPC/signal/signal_64.c
  symbol: restore_sigcontext
  kind: in_body
  lines:
  - 78
  - 81
  quote: "\tregs->cs = sc.cs | 0x03;\n\tregs->ss = sc.ss | 0x03;\n\n\tregs->flags = (regs->flags & ~FIX_EFLAGS) | (sc.flags & FIX_EFLAGS);"
  cpp_conditions: []
  role: restore_sigcontext 令 cs、ss 取 sc 中的值再或上 0x03；flags 只从 sc.flags 取 FIX_EFLAGS 所列的位（含 TF、RF，QD-29），其余位保留当前帧中的原值
- id: AD3-11
  theme: D03
  path: mykernel/arch/x86_64/lock_IPC/signal/signal_64.c
  symbol: __unsafe_setup_sigcontext
  kind: in_body
  lines:
  - 118
  - 119
  quote: "\tunsafe_put_user(current->thread.trap_nr, &sc->trapno, Efault);\n\tunsafe_put_user(current->thread.error_code, &sc->err, Efault);"
  cpp_conditions: []
  role: __unsafe_setup_sigcontext 把 current->thread 的 trap_nr、error_code 写进用户帧的 trapno、err；cr2 在 131 行同样取自 current->thread（三处读取见 SD-53）
- id: AD3-12
  theme: D03
  path: mykernel/arch/x86_64/lock_IPC/signal/signal_64.c
  symbol: x64_setup_rt_frame
  kind: in_body
  lines:
  - 168
  - 171
  quote: "\tif (!(ksig->ka.sa.sa_flags & SA_RESTORER))\n\t\treturn -EFAULT;\n\n\tframe = get_sigframe(ksig, regs, sizeof(rt_sigframe_s), &fp);"
  cpp_conditions: []
  role: x64_setup_rt_frame 在 168–169 行先查 sa_flags，不含 SA_RESTORER 就返回 -EFAULT，这时还没有改写 regs，171 行才调用 get_sigframe；这是 get_sigframe 唯一的活动调用（QD-71），所以 get_sigframe 中要求不含 SA_RESTORER 的旧式备用栈分支进不去（FN-02）
- id: AD3-13
  theme: D03
  path: mykernel/arch/x86_64/lock_IPC/signal/signal_64.c
  symbol: sys_rt_sigreturn
  kind: in_body
  lines:
  - 253
  - 255
  quote: "\tframe = (rt_sigframe_s __user *)(regs->sp - sizeof(long));\n\tif (!access_ok(frame, sizeof(*frame)))\n\t\tgoto badframe;"
  cpp_conditions: []
  role: rt_sigreturn 以 regs->sp - sizeof(long) 作帧地址，对帧只做 access_ok 地址范围检查，不通过时转 badframe
- id: AD3-14
  theme: D03
  path: mykernel/arch/x86_64/myos/interrupt.c
  symbol: excep_hwint_context
  kind: in_body
  lines:
  - 128
  - 129
  quote: "\tif (!in_atomic())\n\t\tschedule();"
  cpp_conditions: []
  role: excep_hwint_context 在 exception_handler 或 hwint_irq_handler 返回后，只要 !in_atomic() 就调用 schedule()；推断：任务在 ip -= 2 的重启循环中反复进出内核时，同一 CPU 上的其他任务能否运行取决于这次调度，RS-10 所记任务切换的 FPU 缺口也因这里的调度不限于信号路径（in_atomic()
    的取值未核）
- id: AD3-15
  theme: D03
  path: mykernel/include/uapi/asm-generic/signal-defs.h
  symbol: SA_RESTART
  kind: macro
  lines:
  - 59
  - 59
  quote: "\t#  define SA_RESTART\t\t0x10000000"
  cpp_conditions:
  - '#ifndef SA_RESTART'
  role: 'SA_RESTART 在外层 #ifndef SA_RESTART 内定义为 0x10000000，是 mykernel 中唯一的定义（QD-45）'
- id: AD3-16
  theme: D03
  path: mykernel/kactive/completion/completion.c
  symbol: wait_for_completion
  kind: in_body
  lines:
  - 54
  - 54
  quote: "\twait_for_common(x, MAX_SCHEDULE_TIMEOUT, TASK_UNINTERRUPTIBLE);"
  cpp_conditions: []
  role: wait_for_completion 以 TASK_UNINTERRUPTIBLE 调用 wait_for_common，这是 wait_for_common 唯一的活动调用（QD-41）
- id: AD3-17
  theme: D03
  path: mykernel/lock_IPC/signal/signal.c
  symbol: get_signal
  kind: in_body
  lines:
  - 921
  - 922
  quote: "\t\tif (!signr)\n\t\t\tbreak; /* will return 0 */"
  cpp_conditions: []
  role: dequeue_synchronous_signal 与 dequeue_signal 都没有取到信号（signr 为 0）时，get_signal 在 921–922 行跳出循环，行内注释写明 will return 0，最后 return signr > 0 返回假（AD3-19）；所以 get_signal 为假的情形包括没有可出队的信号
- id: AD3-18
  theme: D03
  path: mykernel/lock_IPC/signal/signal.c
  symbol: get_signal
  kind: in_body
  lines:
  - 936
  - 940
  quote: "\t\tif (ka->sa.sa_handler == SIG_IGN) /* Do nothing.  */\n\t\t\tcontinue;\n\t\tif (ka->sa.sa_handler != SIG_DFL) {\n\t\t\t/* Run the handler.  */\n\t\t\tksig->ka = *ka;"
  cpp_conditions: []
  role: 出队信号的动作既不是 SIG_IGN 也不是 SIG_DFL 时，get_signal 才把动作拷入 ksig->ka 并返回真；动作为 SIG_IGN 时 continue
- id: AD3-19
  theme: D03
  path: mykernel/lock_IPC/signal/signal.c
  symbol: get_signal
  kind: in_body
  lines:
  - 1049
  - 1049
  quote: "\treturn signr > 0;"
  cpp_conditions: []
  role: get_signal 以 signr > 0 作返回值：只有用户处理函数分支以非零 signr 跳出循环，忽略与默认动作的信号被消耗后都继续循环（RS-03）；没有可出队的信号时 signr 为 0（AD3-17），返回假
- id: AD3-20
  theme: D03
  path: mykernel/lock_IPC/signal/signal.h
  symbol: signal_pending_state
  kind: in_body
  lines:
  - 501
  - 502
  quote: "\t\t\tif (!(state & (TASK_INTERRUPTIBLE | TASK_WAKEKILL)))\n\t\t\t\treturn 0;"
  cpp_conditions:
  - '#if defined(SIGNAL_DEFINATION) || !(DEBUG)'
  role: signal_pending_state 在 state 既不含 TASK_INTERRUPTIBLE 也不含 TASK_WAKEKILL 时（例如 wait_for_completion 传入的 TASK_UNINTERRUPTIBLE）直接返回 0，不读任何 TIF 位
