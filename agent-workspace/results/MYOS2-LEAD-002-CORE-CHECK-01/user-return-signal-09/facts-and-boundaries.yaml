- id: arch.x86_64.user_access
  id_status: proposed_id
  theme: D02
  refines: null
  purpose: 信号路径用到的用户内存访问原语的活动实现：copy_from_user、copy_to_user、get_user、put_user、unsafe_put_user、access_ok。
  entries:
  - mykernel/include/linux/kernel/uaccess.h::copy_from_user
  - mykernel/include/linux/kernel/uaccess.h::_inline_copy_from_user
  - mykernel/include/linux/kernel/uaccess.h::copy_to_user
