fact_notes:
- id: FN-01
  text: __unsafe_setup_sigcontext 把 current->thread 的 trap_nr、error_code、cr2 写进用户帧的 trapno、err、cr2（AD3-11；三处读取见 SD-53）。这三个字段是 thread_struct 的成员（QD-69）。按 '.'/'->' 赋值写法检索，全树没有对它们的活动写入（QD-66），也没有按名字对
    ->thread 整体 memset（QD-67）。已知的整体复制只有 dup_task_struct 中的 *tsk = *orig，源头是 init_task 的 .thread = INIT_THREAD（QD-68），而 INIT_THREAD 只显式初始化 .sp（AD3-02）。推断：其余成员按 C 的初始化规则为 0，写进用户帧的是常量 0，不是内核残留数据。按名检索不能排除用
    memcpy 等方式整体写 thread；init_task 之外的任务结构是否另有初始化路径也未核。按名检索，force_sig_fault、force_sig_info、send_sig_fault、force_sigsegv、force_sig 只出现在注释中（QD-70），所以目前没有应当携带故障信息的信号（推断，未穷尽）。若 CORE-USER-RETURN-SIGNAL-09::RS-01
    成立，这段写入在运行时不可达。只作事实记录，不登记为发现；将来启用故障信号时，需要在异常入口补上这三个字段的写入点。
  evidence:
  - AD3-11
  - SD-53
  - QD-69
  - QD-66
  - QD-67
  - QD-68
  - AD3-02
  - QD-70
- id: FN-02
  text: get_sigframe 的 legacy altstack 分支：原条件开头的 ia32_frame && 被注释，条件变为 !nested_altstack && regs->ss != __USER_DS && !(ka->sa.sa_flags & SA_RESTORER) && ka->sa.sa_restorer（AD3-03），进入后执行
    sp = (ulong) ka->sa.sa_restorer（SD-55）。get_sigframe 唯一的活动调用在 x64_setup_rt_frame 中（QD-71：另两处命中是定义与 extern 声明），而调用之前已要求 sa_flags 含 SA_RESTORER，否则返回 -EFAULT（AD3-12）。所以在这条唯一的调用路径上，!(sa_flags
    & SA_RESTORER) 恒为假，该分支不会进入，是源码层面的死代码。若将来放开这道门，或新增不要求 SA_RESTORER 的调用者，64 位帧也会走这条原本要求 ia32_frame 的分支，把 sp 设为 sa_restorer。sp 本来就取自用户 rsp（SD-54），这条分支不给用户带来新的控制能力（推断）。若 CORE-USER-RETURN-SIGNAL-09::RS-01
    成立，get_sigframe 根本不会被调用。只作事实记录，不登记为发现。
  evidence:
  - AD3-03
  - SD-55
  - QD-71
  - AD3-12
  - SD-54
sr08_dispositions:
- id: SR08-01
  verdict: accept
  summary: 接受。US-01 的核心事实不变：fdget、fdget_pos、fdget_raw 都是 __to_fd，不取引用却返回 flags=3，到达 fdput 时做一次不配对的 fput。08 中 35 处位置，1 处不受影响（L1-28），其余 34 处表述要按条件改读（替换措辞 26 处、只补注 8 处）：下标在 [0,256)、槽内是可用的非空
    file、控制到达清理时，write、writev 净减一；成功的 F_DUPFD 与成功的 F_DUPFD_CLOEXEC（在 [from,256) 找到空槽）由 get_file 抵消，净值为零；F_GETFL、default、FMODE_PATH 白名单拒绝（推断走不到）、from ≥ RLIMIT_NOFILE 而失败的 F_DUPFD/F_DUPFD_CLOEXEC
    净减一；空槽返回 -EBADF，不进入 fdput；下标越界、槽悬空或未写入、alloc_fd 找不到空槽、扫描越过 256 项、fd_install 覆盖非空槽与控制未到达清理，都不给净值。复核新增：US-01.claim 的“在返回前无条件 fdput_pos”与源码不符。另，stdio-08-disposition.md §6 的复核更正 C1 针对本包
    D00 草稿，不是 08 的问题：fd_install 的 BUG_ON 不会让控制停下（panic 在源码层面会返回），所以“fd_install 覆盖非空槽”另列为不给净值的情形（stdio-08-disposition.md §2.3 (x)⑤）。对 08 的更正登记为 CORE-USER-RETURN-SIGNAL-09::ER-01，08 原文件不改。
