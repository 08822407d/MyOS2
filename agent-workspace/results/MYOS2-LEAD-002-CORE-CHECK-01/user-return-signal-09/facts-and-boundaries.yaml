  theme: D02
  refines: null
  purpose: x86_64 信号帧的地址计算与写入，以及处理函数入口寄存器的设置。
  entries:
  - mykernel/arch/x86_64/lock_IPC/signal/signal.c::get_sigframe
  - mykernel/arch/x86_64/lock_IPC/signal/signal_64.c::x64_setup_rt_frame
