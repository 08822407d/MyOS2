    claim: "alloc_pid在idr_alloc/idr_alloc_cyclic传入ptr=NULL；idr_alloc_u32检查slot==NULL后又把NULL写回该槽，未建立区别于空闲的占位状态。后面的idr_replace未检查目标槽是否已经被其它发布者改变，因此在指定set_tid、循环游标回绕或并发等前提下存在数字重复分配/覆盖风险。"
    premises:
      - "两个分配者在首个pid_s对象发布前选择了相同槽，或请求指定相同ID"
      - "随后至少一个分配者进入idr_replace发布阶段；缓存和namespace指针有效"
    impact: "可能破坏PID数字到对象的一对一映射和后继pid_task查找；不声称每次fork必重复或观察到覆盖"
    counter_evidence:
