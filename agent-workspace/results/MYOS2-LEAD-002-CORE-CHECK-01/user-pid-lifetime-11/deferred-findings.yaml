    title: "idr_find直接以用户正pid下标读32768槽数组，无边界校验"
    kind: [source_fact, conditional_language_risk]
    status: deferred_owner_not_ready
    source_ref: "source=time @ a039d9803ade；new_result=user-pid-lifetime-11/facts-and-boundaries.yaml::anchors"
    claim: "mykernel/lib/idr/idr.c::idr_find以idr->idr_rt[id]直接访问数组；idr_init_base仅按MYOS_IDR_BUF_SIZE=32768分配指针数组。sys_kill正pid经find_vpid→find_pid_ns→idr_find没有对这一上界的活动检查。故有效namespace前提下，输入pid>=32768可造成越界访问的源码风险。"
    premises:
      - "用户kill传入可表示的正pid>=32768"
      - "在该版本已初始化的PID命名空间中，当前调用确实到达idr_find，且上述数组长度不经外部变更"
    impact: "不能保证返回NULL/-ESRCH；可能存在语言层越界读取，具体硬件后果不预测"
    counter_evidence:
      - "idr_alloc_u32的分配循环最多访问32767槽，但查询接口不是分配接口，不能把它的边界自动施加给idr_find"
