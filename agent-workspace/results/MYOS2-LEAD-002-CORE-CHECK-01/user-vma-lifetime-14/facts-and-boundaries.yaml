    limits: "does not automatically copy physical pages/refcounts"
    anchors: [VL14-A021, VL14-A026, VL14-A027]
  - id: VL14-O05
    holder: "vm_ops.open/close"
    object: "open invoked conditionally on split, close only selected mmap error"
