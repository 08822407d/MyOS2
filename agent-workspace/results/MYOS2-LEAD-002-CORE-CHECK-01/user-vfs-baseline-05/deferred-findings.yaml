- qualified_id: CORE-USER-VFS-BASELINE-05::UV-05
  id: UV-05
  title: FAT32 普通文件 read()：读目标取自用户缓冲区的内容
  kind:
  - conditional_inference
  status: deferred_owner_not_ready
  owner_action_now: none
  source_ref:
    branch: claude/dazzling-cori-q0dnyt
    path: agent-workspace/results/MYOS2-LEAD-002-CORE-CHECK-01/user-vfs-baseline-05/facts-and-dependencies.yaml
    entry_id: UV-05
    results_commit: 见 MANIFEST.md 的 results_commit_short12
  capabilities:
  - fs.vfs.read_syscall
  - fs.vfs.pagecache_read
  claim: vfs_read 在有 read_iter 时走 new_sync_read，用 iov_iter_ubuf 建 ITER_UBUF 迭代器，只写 ubuf 字段；FAT32 的 read_iter 是 generic_file_read_iter
    → simple_filemap_read，后者从 iter->kvec->iov_base 与 iter->kvec->iov_len 取读目标与长度。kvec 与 ubuf 是同一个联合体成员，所以 iter->kvec 的值就是用户缓冲区地址，读目标与长度取自用户缓冲区前
    16 字节的内容。
  premises:
  - 文件的 i_fop 为 FAT32_file_ops（A-C4-11、Q06）
  - FAT32_file_ops 同时有 read 与 read_iter（Q07），vfs_read 优先 read_iter（A-C4-15）
  - kvec_s 的前两个成员依次为 iov_base、iov_len（阅读记录；类型定义在 uio.h）
  impact: 用户缓冲区全为 0 时 end == start，读返回 0，看起来像文件结束；缓冲区有残留数据时，内核会把文件内容写到由这些数据决定的地址和长度。内核态的 kernel_read 用 kvec 迭代器，不受影响（fs.vfs.kernel_read）。
  counter_evidence:
  - exec 的读路径不受影响（kvec）；缺页读走 ->read，不经 read_iter。
  unknown:
  - 用户程序实际怎样读文件（shell 是否读普通文件）
  - copy 时没有 copy_to_user，内核直接 memcpy 到该地址的后果
  applicable_source: time a039d9803ade（mykernel/、myinitramfs/ 与宿主脚本文本，只读）
  evidence:
