  - fs.vfs.kernel_read
  - fs.vfs.read_syscall
  claim: simple_filemap_read 不按 i_size 截短，不更新 ki_pos；最后一页的长度公式在 end 页对齐时得 0 或负数（VT-FR01：从 0 读 4096 字节得 0，从 100 读到 4096 得 -100，从
    0 读 8192 字节得 4096）。
  premises:
  - 公式按源码转写（A-C4-22）
  - kvec 迭代器（kernel_read）或 UV-05 之外的情形
  impact: read() 的 f_pos 不前进（LBU-06），重复读同一处、读不到文件尾。end 页对齐时：若最后一页从页首开始，该页长度为 0，kernel_read 得到短读，elf_read 判为 -EIO；若起点落在最后一页页内，长度为负，作为
    size_t 交给 memcpy（逐字节 while (count--)，Q41），拷贝越过页面，函数不会正常返回。
  counter_evidence:
  - exec 的 prepare_binprm 读 256 字节，elf_read 读 ELF 头与段表，一般不止于页边界。
  unknown:
  - 实际 ELF 段表的偏移与长度（取决于镜像）
