  capabilities:
  - fs.vfs.fd_table
  - fs.vfs.file_lifecycle
  claim: dup_fd 对父表每个非空槽位 kzalloc 一个新 file 并按值复制（不加引用），父表空槽对应的新槽位不写；files_struct 不带 __GFP_ZERO 且 files_cache 没有构造函数。副本在子进程退出时经
    put_files_struct → filp_close → fput；若副本的 f_count（按值复制自父进程）为 1，就以 kmem_cache_free(filp_cachep, …) 释放，而 kmem_cache_free
    信任传入的 cache（cache_from_obj 被注释）。
  premises:
  - 子进程从继承了打开文件的父进程 fork 而来（例如 init 的 stdin/stdout/stderr 被 /boot/sh 继承）
  - 子进程退出时走 exit_files
  impact: 对象本身经 virt_to_slab 回到它所在的 kmalloc slab 的空闲链，但链表记账（节点链表、min_partial、free_slab）用的是 filp_cachep（Q42）：一个原本已满的 kmalloc
    slab 可能被移到 filp_cachep 的 partial 链上，之后的分配与释放在两个 cache 之间交错。新文件表空槽位的内容取决于 slab 对象原有数据，fd 分配与关闭可能把残留指针当作 file。按值复制使父子各有独立的
    f_pos，与 Linux 的共享 file 语义不同。
  counter_evidence:
  - kfree（sys_close 使用）按对象所在 slab 取 cache，不受这一问题影响。
  unknown:
  - 记账错位之后两个 cache 的后续分配会怎样交错（未逐行推演）
  - slab 对象在分配时的实际内容
  - fork 时父进程各 file 的 f_count 实际值
