  what: IDE_read_handler 只打印错误；ATA_disk_transfer 总是返回 -ENOERR；FAT32_read 的 -EIO 分支在 ATA 配置下不进入；simple_filemap_fault 也丢弃 ->read
    的结果。
- id: LBU-08
  where: 进程退出 / exec 换 mm → 地址空间拆除
  anchors:
  - A-C6-03
  - A-C6-14
  queries: []
  structure_checks:
