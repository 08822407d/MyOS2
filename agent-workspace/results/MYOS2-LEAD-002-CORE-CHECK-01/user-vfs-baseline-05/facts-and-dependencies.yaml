u04_usability:
  layer1: 见各 chains[].segments：connected / connected_with_concern / connected_under_config_text / build_text_only / endpoint
    / broken
  layer2:
  - chain: C1
    source_explanation_ready: 能讲清：首个程序名与参数的来源、根分区的选择规则（GPT、EFI 启动分区、BOOT_FS_IDX）、root/pwd 与 /dev 的建立顺序，以及 exec 失败时为什么仍会跳到用户态。
    runtime_prerequisites: 需要授权的完整内核构建与 QEMU，以及包含 /boot/init、/boot/sh 的根盘镜像；进入用户态还依赖调度前置条件（INTEGRATION-03）。
  - chain: C2
    source_explanation_ready: 能讲清：fork 入口、各资源是复制还是共享、失败标签链的顺序，以及 sighand 实际共享这一现状。
    runtime_prerequisites: 观察父子返回值、文件表副本与失败路径，需要宿主夹具或 QEMU 授权；失败路径需要注入分配失败。
  - chain: C3
    source_explanation_ready: 能讲清：格式注册与分派、ELF 校验与段映射、换 mm 的时点与不可返回点，以及读 ELF 头经过的 VFS 路径。
    runtime_prerequisites: open 返回值的实际取值要看构建产物（NVU-2）；装载成功与否需要 QEMU 与真实镜像。
  - chain: C4
    source_explanation_ready: 能讲清：fd、file、dentry/inode、f_op 的关系与绑定位置，打开时的引用获取，以及 close/fput 不归还的部分；读路径中 read_iter 与 ->read
      的分工。
    runtime_prerequisites: read 的实际行为（UV-05、UV-06）可先在宿主夹具中验证（NVU-1），无需 QEMU；涉及 /dev/console 的读写需要先追 devtmpfs。
  - chain: C5
    source_explanation_ready: 能讲清：文件映射如何装上 vm_ops，缺页如何同步读一页，以及到 ATA 请求提交、等待、完成的两层后端。
    runtime_prerequisites: 需要构建产物确认 ROOTBLK_NVME 与链接保留；完成通知的可靠性依赖 completion 记录（DRU-01）；运行观察需要 QEMU。
  - chain: C6
    source_explanation_ready: 能讲清：退出时实际释放的对象、只减引用的对象、完全缺失的回收（wait4、task_struct、mm）。
    runtime_prerequisites: 观察 wait4 返回值与资源占用需要 QEMU 与用户程序配合（修改用户程序需另行授权）。
