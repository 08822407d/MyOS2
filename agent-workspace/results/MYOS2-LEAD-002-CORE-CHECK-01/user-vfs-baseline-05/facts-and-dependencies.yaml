  what: simple_filemap_read 不更新 ki_pos，new_sync_read 把未变的 ki_pos 写回，f_pos 不前进；也不按 i_size 截短，因而没有 EOF。
- id: LBU-07
  where: 块设备错误 → 调用者
  anchors:
