value_tables:
- id: VT-MR01
  rule: 有非 idle 队首时，入队键 = max(自身键, 队首非 idle 键)；没有时保持自身键。按 A-R6 插在第一个键不小于它的非 idle 节点之前；没有这样的节点时插在 idle 之前。idle 按身份留在尾部。队列不含
    current（B-K1）。
  status: 规则算术，NOT_RUN；A、B、OD-2 都未采用
  rows:
  - id: T1
    case: 自身键大于队首（35 对 10）
    queue_before:
    - - N
      - 10
    steps:
    - task: W
      own_key: 35
      expect_key: 35
    expect_queue_after:
    - N
    - W
    - IDLE
    expect_head: N
  - id: T2
    case: 自身键小于队首（5 对 10）
    queue_before:
    - - N
      - 10
    steps:
    - task: W
      own_key: 5
      expect_key: 10
    expect_queue_after:
    - W
    - N
    - IDLE
    expect_head: W
  - id: T3
    case: 自身键等于队首（10 对 10）
    queue_before:
    - - N
      - 10
    steps:
    - task: W
      own_key: 10
      expect_key: 10
    expect_queue_after:
    - W
    - N
    - IDLE
    expect_head: W
  - id: T4
    case: 新任务原键 0，有非 idle 队首 10
    queue_before:
    - - N
      - 10
    steps:
    - task: W
      own_key: 0
      expect_key: 10
    expect_queue_after:
    - W
    - N
    - IDLE
    expect_head: W
  - id: T5
    case: 没有非 idle 队首（只有 idle），自身键 35
    queue_before: []
    steps:
    - task: W
      own_key: 35
      expect_key: 35
    expect_queue_after:
