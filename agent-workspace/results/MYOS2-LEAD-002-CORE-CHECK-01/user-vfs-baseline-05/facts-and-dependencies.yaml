- id: C2
  title: 创建 / fork
  entry: mykernel/sched/syscall.c::sys_fork（系统调用表 Q04；分派 Q20）
  capabilities:
  - sched.forkexec.fork_entry
  - sched.forkexec.copy_process_resources
  - fs.vfs.fd_table
  - sched.forkexec.mm_refcount_release
  normal_path:
  - sys_fork：0x1000×0x1000 次空计数（Q24）→ kernel_clone(exit_signal = SIGCHLD，flags 为 0)（Q03）。
  - kernel_clone → copy_process（A-C2-03）→ dup_task_struct → copy_files → dup_fd（A-C2-05、A-C2-10）→ copy_fs（复制 fs 并取 root/pwd
