      own_key: 15
      expect_key: 15
    expect_queue_after:
    - N
    - W
    - M
    - IDLE
    expect_head: N
- id: VT-FR01
  page_size: 4096
  formula: 对每个 pgcache_pos = PAGE_ALIGN_DOWN(start), +PAGE_SIZE, … < end：inpage_start = max(pgcache_pos, start) % PAGE_SIZE；若
    pgcache_pos + PAGE_SIZE < end，len = PAGE_SIZE - inpage_start；否则 len = end % PAGE_SIZE - inpage_start。返回值 = Σlen。
  status: 源码公式转写的算术，NOT_RUN；假设 iter 为 kvec（kernel_read），文件足够长。expect_sum_len 是公式给出的 Σlen，不表示函数一定以该值返回：len 为负时 memcpy 以 size_t
    计数越界拷贝（Q41），函数不会正常返回
