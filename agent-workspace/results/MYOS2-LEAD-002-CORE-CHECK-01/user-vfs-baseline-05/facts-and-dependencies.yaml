    = inode->i_fop（A-C4-10；FAT32 为 FAT32_file_ops，A-C4-11）、->open = FAT32_open（f_pos = 0）→ fd_install（A-C4-03）。
  - 对象与引用：fd 是 files->fd_array 的下标；file 持有 f_path（dentry 与 mnt）和 f_inode/f_mapping；打开时取路径引用，f_count 为 1。
