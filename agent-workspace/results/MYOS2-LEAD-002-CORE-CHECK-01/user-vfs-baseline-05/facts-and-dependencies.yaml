    → simple_filemap_read（A-C4-24）→ 页槽位空时 f_op->read = FAT32_read 读满一页（Q25、Q07）→ 拷贝（A-C4-22）→ 返回 len 之和（A-C4-23）→ ksys_read
    把 pos 写回 f_pos（A-C4-14）。
  - 关闭：sys_close 检查 fd < fd_count 后直接 kfree 并清槽（A-C4-25）。退出时则走 put_files_struct → filp_close → fput（A-C4-31、A-C4-30、A-C4-28）。
  failure_cleanup: 打开失败：path_openat fput(file) 并返回 ERR_PTR(error)，但 error 来自没有 return 语句的函数（UV-04）；do_sys_openat2 返回负值，fd
    槽位保持为空。短读与 EOF：simple_filemap_read 不按 i_size 截短，也不更新 ki_pos，所以 f_pos 不前进，读到文件尾之后也不会返回 0（LBU-06，UV-06）；在 ITER_UBUF 下读目标来自用户缓冲区内容（UV-05）。关闭：不看
