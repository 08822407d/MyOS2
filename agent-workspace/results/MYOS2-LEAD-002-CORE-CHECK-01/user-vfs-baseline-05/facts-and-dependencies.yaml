  what: sys_close 直接 kfree，不经 fput，不看引用计数；fs/vfs 中没有活动的 ->release 调用。
- id: LBU-04
  where: fput → path_put / dput / iput
  anchors:
  - A-C4-09
  - A-C4-28
  queries:
  - Q40
  what: myos_do_dentry_open 取路径引用；file_table.c 中没有 path_put、dput、iput，fput 归零只释放 file 对象。
- id: LBU-05
  where: exec 越过不可返回点后的失败 → 致命信号
  anchors:
