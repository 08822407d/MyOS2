dependency_risks:
- id: DRU-01
  depends_on:
  - CORE-CHECK-01::V02、::V03、::V10、::V11（completion/swait 的有限宿主观察；消费时须一起读 reviews/CORE-CHECK-01-recheck-02-review.md）
  - CORE-SCHED-INTEGRATION-03::DV-19（有限超时分支；ATA 用无限等待，是否涉及未核）
  affects:
  - boundary.block.ata_request
  - fs.vfs.pagecache_read
  - fs.vfs.file_mmap_fault_read
  - fs.vfs.root_switch
  - fs.vfs.elf_loader
  what: 每次读盘都在 wait_for_completion 上同步等待，完成由中断处理中的 complete 发出。读文件、文件缺页、根切换、exec 读 ELF 头的可靠性都依赖这对原语。
  evidence_class: source_only
  unknown:
  - 本批没有重查 completion 的实现，也没有运行
- id: DRU-02
  depends_on:
  - CORE-MM-BASELINE-04::DR-01
  - CORE-MM-BASELINE-04::GAP-M05
  - CORE-SCHED-INTEGRATION-03::GAP-02
  affects:
  - fs.vfs.file_mmap_fault_read
  what: 文件缺页在缺页处理中同步等待块 I/O。能否在此睡眠并被唤醒，取决于缺页上下文的 in_atomic/preempt_count 与调度行为。
