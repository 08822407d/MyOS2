  - 睡眠中再次缺页或中断的交互
- id: DRU-03
  depends_on:
  - CORE-SCHED-INTEGRATION-03::SF-C3-37
  - CORE-SCHED-INTEGRATION-03 的 W01/W02/DV-06（新任务入队位置）
  affects:
