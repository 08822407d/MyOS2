    "critical_edge_replacements": [
      {
        "old": "outer -> getter and getter -> tmpde",
        "now": "left true -> get exactly once -> err -> normal; left false -> after",
        "reason": "separates left gate/getter/right check"
      },
      {
        "old": "long_back -> long_read",
        "now": "lcount -> lback (single cursor decrement and readent) -> lattr",
        "reason": "no second readent"
      },
      {
        "old": "long_units -> long_write -> long_update",
        "now": "lunit -> lfilter -> (lstore or filtered lmore) -> lmore -> (lunit or lupdate)",
        "reason": "models all units filtered/no write"
      },
      {
        "old": "short_init -> short_base output writable",
        "now": "salloc -> sbase unconditional; invalid stores lead only to analytical stop",
        "reason": "not an actual allocator check; zero-store return possible"
      },
      {
        "old": "lookup -> namelen0, select -> long",
        "now": "aux -> off -> init -> empty -> iserr -> attr -> notempty -> long",
        "reason": "per-loop timing and actual predicate order"
      },
      {
        "old": "long_update -> long_for",
        "now": "lupdate (one readent, even final) -> lfor -> lret if x>=i",
        "reason": "final pointer may be unused"
      },
      {
        "old": "bound-false -> body",
        "now": "left false -> after only",
        "reason": "do not parse on stale tmpde"
      },
      {
        "old": "null output -> invalid store vs zero writes",
        "now": "conditional stop from store; conditional sret/lret -> nullret after zero writes",
        "reason": "mutually exclusive valid prefixes"
      }
    ],
    "model_corrections": {
      "C16": "i=1,K=0, capacity14, no output writes; if allocation NULL and all source reads/final update return normally, long may return NULL. Not guaranteed from no writes alone.",
      "C18": {
        "classification": "helper_only",
        "namelen": -1,
        "destlen": 3,
        "final_max": 3
      },
      "C19": {
        "classification": "helper_only",
        "namelen": -1,
        "destlen": -2,
        "final_max": -1
      },
      "F03": {
        "invalid_store": "allocation NULL and branch ATTEMPTS store => STOP at first write; no completed normal return",
        "zero_write": "allocation NULL and branch has zero writes and all other accesses return normally => parser can return NULL; caller separately consumes pointer/count",
        "exclusive": true
      },
      "NUL": "0/0xffff long UTF16 units are filtered and loop continues; A,0,B can yield AB under appropriate byte model; first NUL and reported namelen differ",
      "nonzero_len": "for initial n and K accepted, write indices n..n+K-1; i1 n1 K13 writes fit capacity14 but no guaranteed terminal NUL, n2 K13 invalid final write. Actual lookup n0."
    },
    "graph_semantic_note": "The analytical zero-write note is reachable only under the conjunction that all candidate units were filtered; one filtered unit alone does not prove zero total stores."
  },
