observed_not_anchored:
- mm/page_alloc/buddy.h::myos_page_zone：pfn 不在任何区时函数末尾没有 return
- mm/kmalloc/slub.c::bootstrap：未把首个 slab 的 slab_cache 改指新的 kmem_cache（初始化内存未被回收，影响有限）
- mm/vm_map/mmap.c::do_mmap：READ_IMPLIES_EXEC 的 personality 条件被注释，可读映射一律加 PROT_EXEC
- mm/fault/pgalloc.c::__pud_alloc/__pmd_alloc/__pgtbl_alloc：分配失败返回 -ENOMEM 时不释放已取的锁
- mm/fault/fault.c::myos_map_range/myos_creat_one_page_mapping：pte_alloc_map 后检查的是 pmd 而非 pte，alloc_page 结果不判空（myos_get_user_pages 使用后者，Q31）
- mm/vm_map/filemap.c::simple_filemap_fault：page_array 下标未与文件页数比较
- mm/fault/fault.c::handle_pte_fault：已存在 PTE 的 young/dirty 回写被注释，非写缺页可能重复触发
- mm/page_alloc/page-flags.h：PageTable 等其他 page_type 判定同样依赖未初始化的 page_type
- mm/early/memblock.c::memblock_free_all：局部变量 pages 未初始化即累加（结果未被使用）
