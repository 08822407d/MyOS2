  - copy_present_pte 用 arch_ptep_set_wrprotect（仅 clear_bit）写保护父 PTE（A-FT23）
  - flush_tlb_mm 被注释（A-FT24），fork/exec/mm 目录无活动刷新（Q26）
  path:
  - 父进程 fork 前写过某页（TLB 中有可写项）→ fork → 返回用户态继续写该页 → 写入共享物理页
  effect: COW 隔离失效；页引用计数与实际映射数不一致（当前因 MC-05 只表现为泄漏，不会提前释放）。
  counter_evidence:
  - 上下文切换的 switch_mm 写 CR3 会清除非全局 TLB 项（审查代理），之后的写会正确触发 COW
  unknown:
  - 用户 PTE 是否带全局位（审查代理未核，主线未核）
  - fork 返回后父进程在下次切换前写共享页的概率
  reachability: fork 后、父进程下次切换前的窗口。
  anchors:
  - A-FT23
  - A-FT24
  queries:
  - Q26
  - Q27
  independent_review: 审查代理确认。
  status: static_concern
refuted_claims:
- id: RF-01
  original: MC-01 初稿：合并时伙伴不摘链，导致同一物理页出现在两条空闲链、被重复分配。
  verdict: 本 pin 不可达
  why: PageBuddy 恒假，合并循环体从不执行（A-PA17、A-PA18、Q34）。缺陷本身保留为 MC-01 中的潜伏部分。
  anchors:
  - A-PA17
  - A-PA18
  queries:
  - Q34
  source: 独立只读审查代理逐条反驳式复核（未运行代码），主线随后回源复查其关键反证
- id: RF-02
  original: MC-08 初稿：fork 出的任务首次锁 siglock 时，因对象首 8 字节是空闲指针而自旋。
  verdict: 驳回
  why: copy_sighand 的安装语句被注释，任务共用静态 init_sighand（A-KM14、Q33）。
  anchors:
  - A-KM14
  queries:
  - Q33
  source: 独立只读审查代理逐条反驳式复核（未运行代码），主线随后回源复查其关键反证
- id: RF-03
  original: MC-17 初稿：munmap 起点不晚于最低 VMA 时 prev 为 NULL，vma_next_vma(NULL) 自旋。
  verdict: 驳回
  why: find_vma_intersection 只会返回某个非空前驱的后继，不会返回第一个 VMA；该情形下函数直接返回 0（并入 MC-13）。
  anchors:
  - A-VM08
  - A-VM13
  - A-VM14
  queries:
  - Q38
  source: 独立只读审查代理逐条反驳式复核（未运行代码），主线随后回源复查其关键反证
- id: RF-04
  original: MC-23 初稿：共享匿名映射经 do_anonymous_page 返回 VM_FAULT_SIGBUS 后由入口自旋。
  verdict: 路径更正
  why: vma_init 给新 VMA 设 dummy_vm_ops（A-VM18），shmem_zero_setup 不改它，共享匿名 VMA 不算匿名，进入 do_fault 的 ->fault 缺失自旋（A-FT27）；do_anonymous_page 的 VM_SHARED 分支在 mmap 路径下不可达。
  anchors:
  - A-VM18
  - A-FT27
  queries: []
  source: 独立只读审查代理逐条反驳式复核（未运行代码），主线随后回源复查其关键反证
- id: RF-05
  original: MC-08 初稿：sighand_cache 是唯一带构造函数的 cache。
  verdict: 驳回
  why: bdev_cache（init_once）与 shmem_inode_cache（shmem_init_inode）也带 ctor（Q11）；两者在本 pin 无害。
  anchors: []
  queries:
  - Q11
  source: 独立只读审查代理逐条反驳式复核（未运行代码），主线随后回源复查其关键反证
dependency_risks:
- id: DR-01
  depends_on:
  - 中断/异常出口在 !in_atomic() 时调用 schedule()（Q32）
  - integration-03 GAP-02：in_atomic()/preempt_count 实际值未追踪
  - 调度器既有问题 W01/W02/DV-11/DV-13/DV-23（integration-03）
  affects:
  - mm.fault.arch_entry
  - mm.fault.pgtable_walk
  - mm.fault.anonymous
  - mm.fault.file_backed
  - mm.fault.cow
  what: 缺页失败的自旋（MC-23、MC-24）是否只卡住出错任务，取决于中断出口能否把它换下；能否换下又依赖 in_atomic 与调度队列行为。
  evidence_class: source_only
  unknown:
  - 缺页自旋时的 preempt_count
  - 被换下后该任务回队与再选取的顺序
- id: DR-02
  depends_on:
  - f_op->read 之下的文件系统与块设备路径（未追踪）
  - integration-03 已登记的等待机制问题：swait 计数（V02/V03/V10/V11）、有限超时 DV-19
  affects:
  - mm.fault.file_backed
  what: 文件映射缺页同步读文件；若底层读要等待完成通知或超时，缺页可靠性就受这些等待机制影响。
  evidence_class: endpoint_retained_not_traced
  unknown:
  - 具体文件系统 read 是否等待、等待用哪种原语
- id: DR-03
  depends_on:
  - V12 atomic 判负、V13 trylock、swait/completion/schedule_timeout/msleep 系列（integration-03 归集）
  affects:
  - mm.page_alloc
  - mm.kmalloc
  - mm.vm_map
  - mm.fault
  what: 负检索 Q28：mm 与 arch/x86_64/mm 的活动文本不直接使用这些已知有问题的原语；内存子系统直接依赖的是自旋锁（zone->lock、slab list_lock 用关中断版本；page_table_lock 与 PMD 级锁用不关中断的 spin_lock）与普通原子操作。
  evidence_class: negative_search
  unknown:
  - 间接调用（经文件系统、驱动回调）未覆盖
- id: DR-04
  depends_on:
  - MC-08 的 ctor/空闲指针机制
  affects:
  - mm.kmalloc.ctor_cache_state
  - external:mykernel/sched/forkexec/fork.c::copy_sighand
  what: copy_sighand 分配后不安装对象：不会触发锁问题，但每次非 CLONE_SIGHAND 的 fork 泄漏一个 sighand 对象。
  evidence_class: source_only
  unknown:
  - 信号处理语义因共用 init_sighand 而产生的影响（范围外）
- id: DR-05
  depends_on:
  - 中断上下文是否分配内存（未追踪）
  - AP 是否运行（未核）
  affects:
  - mm.page_alloc.buddy_alloc
  - mm.page_alloc.buddy_free
  - mm.vm_map.vma_list_lookup
  - mm.vm_map.mmap_create
  what: 无锁分配（MC-02）与无锁 VMA 操作（MC-18）只有在并发前提成立时才出错；不能因存在 per-CPU 或 NR_CPUS 名字就认为支持 SMP。
  evidence_class: source_only
  unknown:
  - 并发前提本身
- id: DR-06
  depends_on:
  - 上下文切换中 switch_mm 写 CR3 的时机（调度器）
  affects:
  - mm.fault.cow
  - mm.vm_map.mm_lifecycle
  what: fork 后 COW 是否被绕过（MC-25）取决于父进程在下一次切换前是否写共享页；切换时机由调度器决定。
  evidence_class: source_only
  unknown:
  - 用户 PTE 全局位
  - fork 后的切换时机
