m03_answers:
  Q1_physical_pages:
    question: 物理页从哪里准备并分配/归还？
    answer: setup_arch 建立 memblock 与直映射后调 zone_sizes_init 建三区与空闲链表头（E02、A-PA01）；mm_core_init→mem_init→memblock_free_all 把空闲区间按对齐切块，经普通释放路径放进 buddy（E05、A-PA04）。分配：alloc_pages→__myos_alloc_pages 按 NORMAL→DMA32→DMA
      取块并拆分（A-PA06、A-PA07）。归还：__free_pages→__free_pages_ok 在 zone->lock 内挂回链表，但伙伴从不合并（MC-01）；经 folio_put/put_page 的归还在 __folio_put 处断开（LB-01）。
    breaks:
    - LB-01
    - LB-08
    edges:
    - E02
    - E03
    - E04
    - E05
    - E07
    - E08
  Q2_heap_consumes_pages:
    question: 堆接口是否及如何消费页分配？
    answer: 是。slab 新建时 alloc_pages(oo_order)（E09），整 slab 释放时 __free_pages（E10）；>PAGE_SIZE 的 kmalloc 直接按阶要页、kfree 按阶还页（E12、E13）。kmem_cache_init 在 mem_init 之后（E06）。kfree 依据 page->flags 的 PG_slab 位分派（E14），该位是
      flags 位而非 page_type，不受 MC-01 根因影响。
    breaks: []
    edges:
    - E06
    - E09
    - E10
    - E11
    - E12
    - E13
    - E14
  Q3_vm_map_ranges_and_page_tables:
    question: 虚拟映射怎样管理地址区间与页表？
    answer: 只管地址区间：VMA 存在按地址排序的双链表中（E21、E22），mmap/brk/exec 建 VMA，VMA 结构来自 vm_area_cachep（E18、E19）；文件映射经 f_op->mmap 设 vm_ops（E20）。页表不由 vm_map 建立，而是在缺页时由 fault 补齐（E30）；vm_map 也从不拆页表——munmap 与地址空间拆除都断开（LB-02、LB-03），fork
      时由 dup_mmap 调 fault 侧的 copy_page_range 复制（E26）。
    breaks:
    - LB-02
    - LB-03
    - LB-07
    - LB-09
    edges:
    - E16
    - E17
    - E18
    - E19
    - E20
    - E21
    - E22
    - E23
    - E24
    - E25
    - E26
  Q4_fault_to_page:
    question: 缺页入口怎样到实际页获取/映射？
    answer: exception_handler→exc_page_fault（E27）→do_user_addr_fault：simple_find_vma 找包含地址的 VMA（E28）→myos_handle_mm_fault 逐级补页表（页表页来自 buddy，E30）→按 PTE 状态分派：空 PTE 的匿名 VMA 走 do_anonymous_page（读映射零页，写取 folio_alloc
      新页，E31、E34、E35），非匿名走 do_fault（读：页缓存或 simple_filemap_fault 取清零页并 f_op->read，E32、E36、E37；私有写：do_cow_fault），已存在只读 PTE 的写走 do_wp_page→wp_page_copy（E33、E38、E39）。所有错误出口都自旋（LB-05），栈增长断开（LB-04），文件读之下未追踪（LB-06）。
    breaks:
    - LB-04
    - LB-05
    - LB-06
    edges:
    - E27
    - E28
    - E29
    - E30
    - E31
    - E32
    - E33
    - E34
    - E35
    - E36
    - E37
    - E38
    - E39
concerns:
- id: MC-01
  capability: mm.page_alloc.buddy_free
  claim: 释放出的块永远不会与伙伴合并；合并循环本身还缺少“把伙伴从原链表摘下”的步骤，但该缺陷被前一个问题掩盖，在本 pin 不可达。
  premise:
  - PageBuddy(buddy) 判定 page_type 的高位类型基值（A-PA17）
  - page_type 与 _mapcount 共用存储，初始化时 page_mapcount_reset 被注释（A-PA18），mem_map 整体清零；唯一写入是按位清/置 PG_buddy、PG_table 与 myos_* 中的 atomic_inc(_mapcount)（Q34）
  path:
  - __free_pages_ok → __myos_free_one_page（A-PA10）
  - find_buddy_page_pfn → page_is_buddy → PageBuddy 恒假 → 返回 NULL（A-PA13）
  - 循环第一次即 break，按原阶 set_buddy_order + add_to_free_list（A-PA11、A-PA12）
  effect: 空闲块只会被拆小、不会再合大：长时间运行后高阶分配（kmalloc_large、多页 slab、order>0 请求）可能在总空闲足够时失败，失败后又进入 MC-04 的越界路径。若将来修好 page_type 初始化，合并循环会把仍在低阶链表上的伙伴并入高阶块（同一物理页出现在两条链），必须同时补“摘伙伴”。
  counter_evidence:
  - 启动交接 memblock_free_all 按对齐切块，同一区间内每块的同阶伙伴不是已释放的同阶块（审查代理按算术确认），因此即使 PageBuddy 正确，启动期也基本不会走合并
  - 本 pin 中 PageBuddy 恒假这一结论依赖“没有其他代码把 page_type 设为 -1”；Q34 只检索了 mm 与 arch/x86_64/mm 目录
  unknown:
  - mm 目录之外是否有代码写 _mapcount/page_type（未全树检索）
  - 实际负载下碎片化达到失败所需的时间
  reachability: 每一次运行期释放都走这条“不合并”路径；双链缺陷潜伏。
  anchors:
  - A-PA10
  - A-PA11
  - A-PA12
  - A-PA13
  - A-PA17
  - A-PA18
  queries:
  - Q05
  - Q06
  - Q34
  independent_review: 初稿把后果写成“同一物理页上两条链、重复分配”；审查代理指出 PageBuddy 恒假使该后果不可达，主线回源确认（page-flags.h 第 480–491 行、mm_init.c 第 24 行），已改写并把原说法登记为 RF-01。
  status: static_concern
- id: MC-02
  capability: mm.page_alloc.buddy_alloc
  claim: 分配路径修改 zone->free_area 时不取任何锁，而释放路径在 zone->lock + 关中断内修改同一组链表，两者没有互斥。
  premise:
  - __myos_alloc_pages→__rmqueue_smallest→get_page_from_free_area/expand 直接改链表（A-PA07）
  - buddy.c 中只有 __free_pages_ok 取 zone->lock（Q07，A-PA10）
  path:
  - 进程上下文分配中被中断，中断处理里分配或释放同一区 → 链表与 count 被并发修改
  effect: 单 CPU 下只要中断上下文会分配/释放页就可能破坏空闲链；多 CPU 下任意并发分配都可能。
  counter_evidence:
  - __rmqueue_smallest 中对同一节点的第二次摘除是无害的空操作（list_header_delete_node 先判 contains，A-PA08），不构成额外破坏
  - 若没有中断上下文分配、只有 BSP 运行，问题不会出现
  unknown:
  - 中断处理函数是否分配页或 kmalloc（未追踪）
  - AP 是否启动并运行任务（CONFIG_NR_CPUS=256，AP 引导代码存在，未核）
  reachability: 取决于上述两个未知。
  anchors:
  - A-PA07
  - A-PA08
  - A-PA10
  queries:
  - Q07
  independent_review: 审查代理确认；补充 zone->lock 的 spin_lock_init 被注释但 pgdat 被 memset 0，0 值即解锁态。
  status: static_concern
- id: MC-03
  capability: mm.page_alloc.buddy_alloc
  claim: __GFP_ZERO 的高阶分配只清零第 0 页（外加第 1 页开头几个字节），其余页不清零。
  premise:
  - post_alloc_hook 对 i 循环调用 clear_page(page_to_virt(page) + i)，void* 加 i 是字节偏移（A-PA09）
  path:
  - alloc_pages(gfp|__GFP_ZERO, order>0) → prep_new_page → post_alloc_hook
  effect: 调用者若依赖高阶清零，会读到旧数据。
  counter_evidence:
  - 当前活动调用者都不依赖它：alloc_low_pages 只经 alloc_low_page 以 num=1 调用（Q09）；get_zeroed_page 为 0 阶；kmalloc_large 自己 memset 全长；slab 路径在 prepare_alloc_flags 中去掉了 __GFP_ZERO（Q08 与审查代理）
  unknown:
  - 以后新增的高阶 __GFP_ZERO 调用者
  reachability: 潜伏：本 pin 未找到依赖它的活动调用者。
  anchors:
  - A-PA09
  queries:
  - Q08
  - Q09
  independent_review: 审查代理确认并给出“潜伏”判断。
  status: static_concern
- id: MC-04
  capability: mm.page_alloc.buddy_alloc
  claim: 所有偏好区都分配失败时，区循环以 nr_zones=5 为上界读取 3 元素数组 prefered_zone_list 的下标 3、4（越界读，未定义行为）。
  premise:
  - prefered_zone_list 只有 NORMAL/DMA32/DMA 三项，上界为 NODE_DATA(0)->nr_zones（A-PA06）
  - 'nr_zones = MAX_NR_ZONES（A-PA02），枚举无 #if，共 5 个区（A-PA03）'
  path:
  - NORMAL、DMA32、DMA 均无该阶块（或 GFP_DMA 请求从下标 2 开始、DMA 区失败）→ i=3,4 读数组外
  effect: 越界值被当作区下标访问 node_zones，可能返回任意“区”里的块或访问非法内存，而不是干净地返回 NULL。
  counter_evidence:
  - 只在分配失败时触发；正常分配在前三项内返回
  unknown:
  - 编译后栈上越界读到的值
  reachability: 内存耗尽或高阶碎片化（MC-01 会加剧）时可达；GFP_DMA 请求在 DMA 区单独失败时即可达（审查代理补充）。
