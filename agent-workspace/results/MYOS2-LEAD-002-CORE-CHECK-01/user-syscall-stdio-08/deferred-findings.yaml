- qualified_id: CORE-USER-SYSCALL-STDIO-08::US-02
  id: US-02
  title: f_dupfd 以 RLIMIT_NOFILE（1024）为上界扫描只有 256 项的 fd 表
  kind: [source_fact, conditional_inference]
  status: deferred_owner_not_ready
  owner_action_now: none
  source_ref: {branch: claude/dazzling-cori-q0dnyt, path: agent-workspace/results/MYOS2-LEAD-002-CORE-CHECK-01/user-syscall-stdio-08/deferred-findings.yaml, entry_id: US-02, results_commit: 见 MANIFEST.md 的 results_commit_short12}
  capabilities: [fs.vfs.fd_dup_fcntl]
  claim: fcntl 的 F_DUPFD 与 F_DUPFD_CLOEXEC 都调用 f_dupfd（AS3-27），它以 rlimit(RLIMIT_NOFILE) 为上界、只检查起点不小于该上界，然后 alloc_fd(from, nofile)（AS3-28）。RLIMIT_NOFILE 的初值是 INR_OPEN_CUR=1024（AS3-06、AS3-07、QS-24），fork 时按值复制（AS3-08）；fd_array 只有 NR_OPEN_DEFAULT=256 项（AS3-04、AS3-05）。f_dupfd 中没有按表长度收紧上界的代码（SS-21）。找到槽位后 get_file 并 fd_install（AS3-37）。VT-FDLIMITS 由源码重算得 nofile_exceeds_table 为真。
  premises: [F_DUPFD 的起点在 256 到 1023 之间，或从起点到 255 的槽都非空]
  impact: alloc_fd 读 fd_array 之外的内存并把它当作槽位判断；若读到的值为 0，fd_install 会把 file 指针写到数组之外（BUG_ON 只在该处非 0 时触发）。返回给用户的 fd 不小于 256：close、lseek 检查 fd < fd_count（256）而返回 -EBADF，所以它无法被关闭，退出时 put_files_struct 也只扫描前 256 个槽（QS-38）；read、getdents64（myos_fdget_pos）与 write、writev、fcntl（__to_fd）按下标访问时越界（CORE-USER-VFS-BASELINE-05::UV-11）。
  counter_evidence: ['dup、dup2 是空壳，不经过 f_dupfd（CORE-USER-BOUNDARIES-07::UB-10）', 起点小于 256 且其后有空槽时扫描在表内结束]
  unknown: [files_struct 之后的内存布局（kmem_cache 对象大小与相邻对象，未追）, 用户程序是否用 F_DUPFD（GAP-U10）]
  applicable_source: time a039d9803ade（mykernel/fs/vfs/file.c、fcntl.c、include/linux/kernel/fdtable.h，只读）
  evidence: [AS3-04, AS3-05, AS3-06, AS3-07, AS3-08, AS3-38, AS3-27, AS3-28, AS3-37, SS-18, SS-21, QS-23, QS-24, QS-38, VT-FDLIMITS]
  related: ['CORE-USER-VFS-BASELINE-05::UV-11', 'CORE-USER-VFS-BASELINE-05::UV-10']
  blocks: {static_work: false, future_runtime: 影响 NVS-1}
  future_verification:
    candidates: [NVS-1]
    authorization_needed: [完整内核构建授权, QEMU 运行授权, 可修改的测试镜像]
  reopen_conditions: Owner 明确表示准备好并给出专项范围许可；开工前重核 f_dupfd 与 fd 表定义。
  ai_suggestion: 上界可取 min(rlimit, 表长度)，或像 Linux 那样按需扩表；建议不等于决定。
