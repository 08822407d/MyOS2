- qualified_id: CORE-USER-SYSCALL-STDIO-08::US-01
  id: US-01
  title: fdget/fdget_pos/fdget_raw 不取引用却带 FDPUT_FPUT：write、writev 每次调用，以及除成功的 F_DUPFD 之外的每次 fcntl，都多做一次 fput
  kind: [source_fact, conditional_inference]
  status: deferred_owner_not_ready
  owner_action_now: none
  source_ref: {branch: claude/dazzling-cori-q0dnyt, path: agent-workspace/results/MYOS2-LEAD-002-CORE-CHECK-01/user-syscall-stdio-08/deferred-findings.yaml, entry_id: US-01, results_commit: 见 MANIFEST.md 的 results_commit_short12}
  capabilities: [fs.vfs.fd_lookup_ref, fs.vfs.rw_syscalls, fs.vfs.fd_dup_fcntl]
  claim: fdget、fdget_raw、fdget_pos 都是 __to_fd：直接按下标取 fd_array，不增加 f_count，却返回 flags=3（AS3-15、AS3-16、SS-07）。fdput 在 flags 含 FDPUT_FPUT（=1）时调用 fput（AS3-13、AS3-14），fdput_pos 转调 fdput（AS3-17）。ksys_write 与 do_writev 用 fdget_pos 取 file，并在返回前无条件 fdput_pos（AS3-20 至 AS3-23、SS-03 至 SS-06）；sys_fcntl 用 fdget_raw 并在返回前 fdput（AS3-25、AS3-26、SS-09、SS-10）；其中成功的 F_DUPFD/F_DUPFD_CLOEXEC 先 get_file，与这次 fput 相抵（AS3-37），F_GETFL、失败的 F_DUPFD 与不支持的命令（default 分支，AS3-39）则只剩这次 fput。fput 把 f_count 减一，归零时调 kmem_cache_free(filp_cachep, …)（AS3-11、SS-11）。读路径用的 myos_fdget_pos 返回 flags=0，不受影响（AS3-18、SS-01、SS-02）。VT-FDLIMITS 由源码重算得 to_fd_implies_fput 为真、myos_fdget_pos_implies_fput 为假。
  premises: ['该 fd 的 file 在调用时 f_count 为 1（open 刚建立时就是 1，AS3-09；fork 复制出的 file 按值抄父表的计数，CORE-USER-VFS-BASELINE-05::UV-09）', fcntl 的情形限于成功的 F_DUPFD/F_DUPFD_CLOEXEC 以外的命令]
  impact: 对这样的 fd 做第一次 write(2)、writev(2)，或第一次除成功的 F_DUPFD 之外的 fcntl(2) 后，file 对象被释放，而 fd 槽仍指向它：open 建立的 file 回到 filp 缓存；fork 经 dup_fd 复制出的 file 来自 kzalloc，这次 kmem_cache_free(filp_cachep, …) 走的是 CORE-USER-VFS-BASELINE-05::UV-09 所述的跨缓存路径。之后同一 fd 上的 read、write、writev、lseek、close 都访问已释放的对象，close 还会对它再 kfree 一次。若这块内存被重新分配给另一个 file，旧 fd 上的下一次 write、writev 或 fcntl 会把新 file 的 f_count 减一，若它原为 1 就释放它。write(2) 即使在 vfs_write 返回 -EINVAL（CORE-USER-BOUNDARIES-07::UB-01）也会做这次 fput。
  counter_evidence: [read 与 getdents64 用 myos_fdget_pos（flags=0），配对的 fdput_pos 不 fput（QS-21、QS-22）, 成功的 F_DUPFD 先 get_file 再 fdput，净值不变（AS3-37），但此后两槽共享的 file 的 f_count 仍为 1, close、lseek 直接按下标访问，不经 fdget/fdput]
  unknown: [释放后 file 对象的哪些字段会被 slab 改写、何时被重新分配（未追）, 用户程序对标准流实际使用 write、writev 还是 fcntl（GAP-U10）]
  applicable_source: time a039d9803ade（mykernel/include/linux/fs/file.h、fs/vfs/read_write.c、fs/syscall.c、fs/vfs/file_table.c，只读）
  evidence: [AS3-09, AS3-11, AS3-13, AS3-14, AS3-15, AS3-16, AS3-17, AS3-18, AS3-20, AS3-21, AS3-22, AS3-23, AS3-25, AS3-26, AS3-37, AS3-39, SS-01, SS-03, SS-04, SS-05, SS-06, SS-07, SS-09, SS-10, SS-11, QS-20, QS-21, VT-FDLIMITS]
  related: ['CORE-USER-VFS-BASELINE-05::UV-09', 'CORE-USER-VFS-BASELINE-05::UV-10', 'CORE-USER-BOUNDARIES-07::UB-01']
  blocks: {static_work: false, future_runtime: 影响 NVS-1 中对 console 写出与 fd 状态的观察解释}
  future_verification:
    candidates: [NVS-1]
    authorization_needed: [完整内核构建授权, QEMU 运行授权, 可修改的测试镜像]
