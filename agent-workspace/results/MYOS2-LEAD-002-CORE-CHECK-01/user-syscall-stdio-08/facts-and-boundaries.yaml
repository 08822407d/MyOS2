- id: VT-FDLIMITS
  type: fd_limits
  purpose: fd 表长度、RLIMIT_NOFILE 初值、fdput 的标志位与两种 fdget 写法返回的 flags，并由此得出三项推论
  sources:
  - mykernel/include/linux/kernel/fdtable.h
  - mykernel/include/uapi/linux/fs.h
  - mykernel/include/uapi/asm-generic/resource.h
  - mykernel/include/linux/fs/file.h
  - mykernel/fs/vfs/file.c
  assumptions:
  - RLIMIT_NOFILE 的初值经 init_signals.rlim = INIT_RLIMITS（AS3-07）给 init_task，fork 时由 copy_signal 按值复制（AS3-08）；运行中是否被改写未追（没有 setrlimit 表项，VT-SYSTAB）
  values:
    NR_OPEN_DEFAULT: 256
    NR_OPEN_MAX: NR_OPEN_DEFAULT
    fd_array_size: NR_OPEN_DEFAULT
    INR_OPEN_CUR: 1024
    RLIMIT_NOFILE_initial: INR_OPEN_CUR
    FDPUT_FPUT: 1
    to_fd_flags: 3
    myos_fdget_pos_flags: 0
    init_files_fd_count: 0
    dup_fd_sets_fd_count: NR_OPEN_DEFAULT
    f_dupfd_bound: RLIMIT_NOFILE
    f_dupfd_alloc_end: nofile
    to_fd_implies_fput: true
    myos_fdget_pos_implies_fput: false
    nofile_exceeds_table: true
