- id: fs.vfs.fd_lookup_ref
  id_status: proposed_id
  theme: C03
  refines: null
  purpose: 按 fd 取 file 与归还引用的几种写法，以及 close、lseek 的直接下标访问。
  entries:
  - mykernel/include/linux/fs/file.h::__to_fd
  - mykernel/include/linux/fs/file.h::fdput
  - mykernel/fs/vfs/file.c::myos_fdget_pos
  - mykernel/fs/vfs/file_table.c::fput
  - mykernel/fs/syscall.c::sys_close
  - mykernel/fs/syscall.c::sys_lseek
  normal_path: __to_fd 直接按下标取 fd_array，不取引用，返回 flags=3（AS3-15、SS-07）；fdget、fdget_raw、fdget_pos 都是它（AS3-16、QS-20）。fdput 在 flags 含 FDPUT_FPUT（=1）时调 fput（AS3-13、AS3-14），fdput_pos 转调 fdput（AS3-17、QS-21）。读路径用的
    myos_fdget_pos 同样按下标取，但 flags=0（AS3-18、SS-08、QS-22）。fput 把 f_count 减一，归零时调 kmem_cache_free(filp_cachep, …)（AS3-11、CORE-USER-VFS-BASELINE-05::A-C4-28、SS-11、QS-30）；对 dup_fd 复制出的 file，这块内存其实来自
    kzalloc（UV-09）。close 直接 kfree 并清槽（CORE-USER-VFS-BASELINE-05::A-C4-25）；lseek 检查上界后直接读 fp->f_op（AS3-29、SS-19、QS-28）。
  failure_path: VT-FDLIMITS 重算得 to_fd_implies_fput 为真：每对 fdget*/fdput* 都会去掉一个从未取得的引用（US-01）。lseek 对上界以内的空槽读 NULL->f_op（追加到 UV-11）。
