- id: entry.syscall_dispatch
  id_status: proposed_id
  theme: C02
  refines: CORE-USER-BOUNDARIES-07::entry.syscall_frame_return
  purpose: 从 syscall 指令进入内核、检查号、调用处理函数，到把返回值写进寄存器帧的一段。
  entries:
  - mykernel/arch/x86_64/entry/entry_64.S::entry_SYSCALL_64
  - mykernel/arch/x86_64/entry/common.c::do_syscall_64
  - mykernel/arch/x86_64/entry/syscall_64.c::x64_sys_call
  normal_path: syscall_init 把 MSR_LSTAR 设为 entry_SYSCALL_64（AS2-01，#else 分支，QS-11、QS-12）。入口把 rax（系统调用号）压为 orig_ax，PUSH_REGS 又把同一个 rax 压为 ax（AS2-02）；Linux 中把 ax 预置为 -ENOSYS 的写法被注释（AS2-03、QS-18）；随后
    rdi = 帧地址、rsi = 符号扩展后的 eax（AS2-04）。do_syscall_64 把号转为无符号，小于 __NR_syscalls（453）才 regs->ax = x64_sys_call(regs, unr)（AS2-05、SS-15）。x64_sys_call 是由 syscalls_64.h 展开的 switch（AS2-07、AS2-08）；每个
    case 调 __x64_sys_X(regs)，它转调 __se_sys_X，再按 di、si、dx、r10、r8、r9 取参数调用 __do_sys_X（AS2-09、AS2-10、AS2-11）。之后 syscall_exit_to_user_mode，并落入 syscall_return_via_sysret（CORE-USER-BOUNDARIES-07
    的 FP-3）。
  failure_path: 号不小于 453（包括转成无符号后的负号）时 ax 不被写，用户拿回原 rax，也就是系统调用号；号小于 453 但表中没有时进 __x64_sys_ni_syscall，打印后 while (1)（AS2-06）；452 号是 sys_no_syscall，返回 -ENOSYS（AS2-13）；处理函数没有活动 return 时（dup、dup2、wait4；exit
    在 do_exit 之后同样没有 return，VT-SYSTAB），若函数返回，写入 ax 的值没有定义。
  unknown:
  - sysretq 与 swapgs 的硬件语义（CORE-USER-VFS-BASELINE-05::GAP-U04 经 07 收窄后的剩余部分，07 NVB-4）
  - 运行时的实际号与参数（NOT_RUN）
  not_covered:
  - syscall_exit_to_user_mode 与信号处理内部（07 已登记为端点）
