- id: fs.vfs.fd_dup_fcntl
  id_status: proposed_id
  theme: C03
  refines: null
  purpose: 复制 fd 的入口：dup、dup2、dup3 与 fcntl(F_DUPFD)，以及 fcntl 的其他分支。
  entries:
  - mykernel/fs/syscall.c::sys_dup
  - mykernel/fs/syscall.c::sys_dup2
  - mykernel/fs/syscall.c::sys_fcntl
  - mykernel/fs/vfs/fcntl.c::do_fcntl
  - mykernel/fs/vfs/file.c::f_dupfd
  normal_path: dup、dup2 只有提示宏，没有 return（UB-10、VT-SYSTAB）；dup3 不在表中，会进缺项循环（UB-09）。fcntl 用 fdget_raw 取 file（AS3-25、SS-09），F_DUPFD 与 F_DUPFD_CLOEXEC 交给 f_dupfd（AS3-27、SS-18、QS-23）：上界取 rlimit(RLIMIT_NOFILE)（初值
    INR_OPEN_CUR=1024：init_task.signal 指向 init_signals，其 rlim 为 INIT_RLIMITS，AS3-38、AS3-07、AS3-06、QS-24；fork 时按值复制，AS3-08）再 alloc_fd（AS3-28），找到后 get_file 并 fd_install，新旧两个槽指向同一个 file（AS3-37）；返回前
    fdput（AS3-26、SS-10）。成功的 F_DUPFD 中 get_file 与 fdput 相抵，f_count 不变而两槽共享；F_GETFL、失败的 F_DUPFD 与不支持的命令（default 分支只打印，err 保持 -EINVAL，AS3-39）只剩 fdput 的一次 fput。F_GETFL 返回 f_flags；F_GETFD、F_SETFD、F_SETFL
    分支被注释，落到 err 的初值 -EINVAL（SS-17、QS-26、QS-31）。
  failure_path: f_dupfd 的上界 1024 大于 fd 表的 256 项（US-02、VT-FDLIMITS、SS-21）；close-on-exec 无法设置或查询（US-03）；除成功的 F_DUPFD 外，fcntl 也以一次不配对的 fput 结束（US-01）。复制出的两个槽共享一个 file，表内（fd < 256）任一槽 close
    都直接 kfree（CORE-USER-VFS-BASELINE-05::UV-10）；得到的 fd ≥ 256 时 close、lseek 返回 -EBADF（QS-38）。
  unknown:
  - libc 是否用 dup2、dup3 或 fcntl 重定向标准流（GAP-U10）
