- id: FL-01
  stage: pid 1 的初始表
  code_path: rest_init → kernel_thread(kernel_init, …, CLONE_FS) → copy_files → dup_fd(init_files, NR_OPEN_MAX)
  slot_effect: init_files 的槽全为空、fd_count 为 0；dup_fd 把新表 fd_count 设为 256，只写父表非空的槽，所以 pid 1 的 256 个槽都没有被写入；console_on_rootfs 被注释，内核不打开 console
  refcount_effect: 没有 file 被建立
  evidence:
  - AS3-01
  - AS3-02
  - AS3-03
  - QS-19
  - VT-FDLIMITS
  concerns:
  - CORE-USER-VFS-BASELINE-05::UV-09
- id: FL-02
