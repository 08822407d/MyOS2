- id: sched.forkexec.fd_inherit_exec
  id_status: proposed_id
  theme: C03
  refines: null
  purpose: pid 1 的初始 fd 表，以及 fork、exec 对 fd 表的处理。
  entries:
  - mykernel/init/main.c::rest_init
  - mykernel/sched/forkexec/fork.c::copy_files
  - mykernel/sched/forkexec/fork.c::unshare_fd
  - mykernel/sched/forkexec/exec.c::begin_new_exec
  - mykernel/fs/vfs/file.c::dup_fd
  normal_path: kernel_init 由 kernel_thread 以 CLONE_FS 调用建立（kernel_thread 另加 CLONE_VM 与 CLONE_UNTRACED），不带 CLONE_FILES（AS3-01），copy_files 因而以 dup_fd(init_files, NR_OPEN_MAX) 复制出它自己的表（AS3-03）；init_files
    的 fd_count 为 0（AS3-02），所有槽为空，dup_fd 把新表的 fd_count 设为 256（VT-FDLIMITS）但只写父表非空的槽（CORE-USER-VFS-BASELINE-05::UV-09）。console_on_rootfs 只出现在注释中（QS-19），内核不为 pid 1 打开任何 fd。exec 的 begin_new_exec
    只调用 unshare_files（AS3-35），后者只在表被共享时复制（AS3-34）；do_close_on_exec 被注释（QS-25、SS-16），所以 exec 保留全部 fd。fork 不带 CLONE_FILES 时同样经 dup_fd 按值复制（UV-09）。
  failure_path: pid 1 新表中的槽没有被写入，内容取决于 slab 对象原有数据（UV-09 的未知项）；close-on-exec 没有实现（US-03）。
  unknown:
  - pid 1 文件表各槽在运行时的实际内容
  not_covered:
  - 退出时的回收（CORE-USER-VFS-BASELINE-05::UV-15）
