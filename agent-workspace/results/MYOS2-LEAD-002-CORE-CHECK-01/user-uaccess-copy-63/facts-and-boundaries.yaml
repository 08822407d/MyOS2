    "source_contract": "input n, raw output r, before memset ensure 0<=r<=n and valid destination; copied prefix n-r; zero padding of last r only for from-user",
    "to_user_guard": "access_ok(to,n) false leaves n unchanged; if true raw returns residual; no memset",
    "from_user_guard": "source access_ok(from,n), might_fault, instrument and check_copy_size appear commented in selected inline code",
    "asm_contract": "copy_user_generic stac; asm alternate rep movsb vs call rep_movs_alternative using +c(len)/+D(to)/+S(from); extable source annotation; clac; return residual len",
    "rep_movs_alternative_definition": "NOT_LOCATED_IN_SELECTED_DIRECT_SOURCE; only declaration in uaccess_64.h; code search of default branch was limited and cannot prove global absence"
  },
