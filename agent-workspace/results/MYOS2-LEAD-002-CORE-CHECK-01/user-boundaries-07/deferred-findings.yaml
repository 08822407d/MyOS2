- qualified_id: CORE-USER-BOUNDARIES-07::UB-01
  id: UB-01
  title: write(2) 在 vfs_write 的 FMODE_CAN_WRITE 检查处返回，静态上到不了任何文件的 ->write
  kind: [source_fact, conditional_inference]
  status: deferred_owner_not_ready
  owner_action_now: none
  source_ref: {branch: claude/dazzling-cori-q0dnyt, path: agent-workspace/results/MYOS2-LEAD-002-CORE-CHECK-01/user-boundaries-07/facts-and-boundaries.yaml, entry_id: UB-01, results_commit: 见 MANIFEST.md 的 results_commit_short12}
  capabilities: [fs.vfs.write_dispatch, drivers.char.console_write]
  claim: vfs_write 在调用 ->write 之前要求 f_mode 含 FMODE_CAN_WRITE，否则返回 -EINVAL；在 mykernel/ 中这个位只有定义和两处活动检查（另一处在 __kernel_write_iter）。f_mode 的活动赋值只有 file_table.c 中的 OPEN_FMODE(flags) 与块设备 open 中追加的其他位；OPEN_FMODE 只产生访问位（FMODE_READ/FMODE_WRITE）与 __FMODE_NONOTIFY。
  premises: [所读快照中没有以其他写法（例如整体结构复制以外的位运算宏）设置 FMODE_CAN_WRITE 的活动代码；检索范围见 QB-23、QB-24]
  impact: 用户 write(2) 对以写方式打开的任何文件都返回 -EINVAL（未以写方式打开的先因缺 FMODE_WRITE 返回 -EBADF），到不了 ->write；console 输出只能经 writev(2) 到达 myos_tty_write；内核内部的 kernel_write 同样被拦截。
  counter_evidence: [writev 路径没有这项检查（SB-07），可以到达 ->write, dup_fd 按值复制 file 时会复制 f_mode，但复制不到本来就没有的位]
  unknown: [检索无法排除通过函数指针或宏拼接设置该位的写法]
  applicable_source: time a039d9803ade（mykernel/，只读）
  evidence: [AB3-19, QB-23, QB-24, SB-09, VT-FLAGS]
  related: ['CORE-USER-VFS-BASELINE-05::GAP-U06']
  blocks: {static_work: false, future_runtime: 影响 NVB-1 中 console 输出的观察方式}
  future_verification:
    candidates: [NVB-1]
    authorization_needed: [完整内核构建授权, QEMU 运行授权]
  reopen_conditions: Owner 明确表示准备好并给出专项范围许可；开工前重核 time 源码是否仍与本条证据一致。
  ai_suggestion: 以后处理时可对照 Linux 在打开文件时按 f_op 设置 FMODE_CAN_READ/FMODE_CAN_WRITE 的做法；建议不等于决定。
- qualified_id: CORE-USER-BOUNDARIES-07::UB-02
  id: UB-02
  title: devtmpfs 请求在完成通知后被工作线程释放，提交方随后仍写其完成量并读取 err
  kind: [source_fact, conditional_inference]
  status: deferred_owner_not_ready
  owner_action_now: none
  source_ref: {branch: claude/dazzling-cori-q0dnyt, path: agent-workspace/results/MYOS2-LEAD-002-CORE-CHECK-01/user-boundaries-07/facts-and-boundaries.yaml, entry_id: UB-02, results_commit: 见 MANIFEST.md 的 results_commit_short12}
  capabilities: [drivers.base.devtmpfs_node_create]
  claim: devtmpfs_create_node 以 kzalloc 分配请求（QB-55）；工作线程写 req->err、complete(&req->done) 后立即 kfree(req)。提交方在 wait_for_completion 返回之前还要对 req->done 加锁、摘下等待项并把 done 减一（QB-56），返回后再执行 return req->err。devtmpfs_delete_node 用栈上的 req 走同一条队列（QB-55），工作线程同样会对它 kfree（该函数目前没有活动调用者）。
  premises: [工作线程的 kfree(req) 先于提交方在 wait_for_completion 中对 req->done 的后续访问（两线程的实际交错未知）]
  impact: 若前提成立，提交方对已释放内存既写（锁字、等待队列链表、done 计数）又读（err）；写入可能破坏随后分配到这块内存的对象。唯一的活动调用者 device_add 不使用返回值，这只免除读取 err 的后果，不免除对完成量的写入。
  counter_evidence: [唯一的活动调用者 device_add 忽略返回值（AB3-06、SB-10），但只涉及读取 err 这一半]
  unknown: [运行时的实际交错与 slab 重用情况, kfree 是否在空闲对象内写分配器信息（未追）]
  applicable_source: time a039d9803ade（mykernel/drivers/base/devtmpfs.c，只读）
  evidence: [AB3-07, AB3-08, QB-14, QB-55, QB-56]
  related: ['CORE-USER-VFS-BASELINE-05::GAP-U05']
  blocks: {static_work: false, future_runtime: 无}
  future_verification:
