  source_ref: {branch: claude/dazzling-cori-q0dnyt, path: agent-workspace/results/MYOS2-LEAD-002-CORE-CHECK-01/user-boundaries-07/facts-and-boundaries.yaml, entry_id: UB-14, results_commit: 见 MANIFEST.md 的 results_commit_short12}
  capabilities: [user.initramfs.init_console_reopen]
  claim: do_filp_open 把 op->lookup_flags 原样交给 path_openat（QB-52），后者再交给 open_last_lookups，那里用 open_flag & O_CREAT 选择分支（QB-32）。O_CREAT 与 LOOKUP_RCU 同为 64（VT-FLAGS），build_open_flags 设置的查找标志里没有 LOOKUP_RCU（QB-51），所以总走只查找分支；创建分支（lookup_open）整段被注释。不存在的最后一段由 __lookup_slow 返回 ERR_PTR(-ENOENT)，经 link_path_walk 开头的 IS_ERR 检查（AB1-23）成为 path_openat 的错误返回。若将来该位能为 1，由于创建分支被注释，dentry 未赋值就进入 step_into。
  premises: [用户以含 O_CREAT 的标志打开尚不存在的文件（例如 fopen 的 "w" 模式通常带 O_CREAT）]
  impact: open/fopen 无法新建文件，返回 -ENOENT。已存在的文件（包括 /dev/console）不受影响：init 以 "w" 模式 freopen /dev/console 时，只查找分支照样能找到节点。新建文件只能经 creat(2) 的 do_creatat。
