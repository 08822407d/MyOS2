- qualified_id: CORE-USER-BOUNDARIES-07::UB-03
  id: UB-03
  title: kernel_init（exec 后即 pid 1）、kthreadd 与 kthread 共享 init_fs，根切换时直接改写且绕过引用计数
  kind: [source_fact, conditional_inference]
  status: needs_evidence
  owner_action_now: none
  source_ref: {branch: claude/dazzling-cori-q0dnyt, path: agent-workspace/results/MYOS2-LEAD-002-CORE-CHECK-01/user-boundaries-07/facts-and-boundaries.yaml, entry_id: UB-03, results_commit: 见 MANIFEST.md 的 results_commit_short12}
  capabilities: [sched.misc.init_fs_sharing, drivers.base.devtmpfs_setup, drivers.base.devtmpfs_node_create, fs.vfs.init_mount_path]
  claim: kernel_init 由 kernel_thread(…, CLONE_FS) 建立，kernel_thread 只在调用方 flags 上加 CLONE_VM 与 CLONE_UNTRACED（QB-64）；copy_process 把 clone_flags 交给 copy_fs，CLONE_FS 时只把 fs->users 加一（QB-63）。kthreadd（CLONE_FS|CLONE_FILES）与 create_kthread 建的线程（CLONE_FS|CLONE_FILES|SIGCHLD）同样共用 init_task 的 init_fs。exec 对 fs 只清 in_exec（QB-57），不拆分（QB-67），所以进入用户态的 init（pid 1）继续使用这份共享结构。kdevtmpfs 的 chdir/chroot 改写它；set_init_taskfs 直接对其 root/pwd 赋值，不取新引用也不放旧引用。根切换之后 kdevtmpfs 的 cwd 也是 FAT32 根，FAT32 目录操作中没有 mknod。
  premises: [影响一：根切换之后仍有设备注册经 devtmpfs_create_node 建节点（本批没有找到这样的调用）, 影响二：pid 1 在用户态调用 chdir（initd.c 中没有，QB-70；pid 1 以后若 exec 其他程序则未查）]
  impact: 影响一成立时，后注册设备的节点会尝试建在 FAT32 根下，并因 vfs_mknod 找不到 ->mknod 而失败。影响二成立时，chdir 经 curr->fs->pwd = path 直接改写共享结构（QB-68），kdevtmpfs 等内核线程的当前目录随之改变，之后按相对路径建节点的起点也变了。
  counter_evidence: [本批读到的 console、tty、mem 设备都在根切换之前登记, 用户态 fork 不带 CLONE_FS（05 已读），pid 1 之后的用户进程得到 fs 副本, initd.c 中没有 chdir/chroot 调用（QB-70）]
  unknown: [根切换之后是否还有 device_add（本批未穷尽）, 引用计数偏差的后果（path_get/path_put 的 mntget/mntput 也被注释）, pid 1 以后 exec 的程序是否调用 chdir]
  applicable_source: time a039d9803ade（mykernel/，只读）
  evidence: [AB1-02, AB1-16, AB1-21, QB-05, QB-06, QB-07, QB-48, QB-57, QB-63, QB-64, QB-67, QB-68, QB-70]
  related: ['CORE-USER-VFS-BASELINE-05::UV-01', 'CORE-USER-VFS-BASELINE-05::DRU-06', 'CORE-USER-BOUNDARIES-07::ER-01']
  blocks: {static_work: false, future_runtime: 无}
  future_verification:
