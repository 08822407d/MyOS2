- id: sched.misc.init_fs_sharing
  id_status: proposed_id
  theme: B01
  refines: null
  purpose: 说明任务 root/pwd 存在哪里、谁在何时改写、谁读取：init_task、kernel_init、kthreadd 与 kthread 共用同一个 init_fs。
  entries:
  - mykernel/sched/misc/fs_struct.c::init_fs
  - mykernel/sched/forkexec/fork.c::copy_fs
  normal_path: init_task.fs = &init_fs（QB-06）。rest_init 以 CLONE_FS 创建 kernel_init，kthreadd 以 CLONE_FS|CLONE_FILES 创建，create_kthread 以 CLONE_FS|CLONE_FILES|SIGCHLD 创建所有 kthread（QB-05）；copy_fs
    带 CLONE_FS 时沿用同一结构（AB1-21）。改写顺序：mnt_init → init_mount_tree 设为 rootfs 根（QB-07）；kdevtmpfs 在 devtmpfsd 中 chdir("/..")、chroot(".") 改写（AB1-16，init_chroot 内调 set_fs_root，QB-07）；根盘切换时 set_init_taskfs
    直接赋值为 FAT32 根（AB1-02）。读取者是 path_init（QB-47）。kernel_thread 把调用方 flags 与 CLONE_VM|CLONE_UNTRACED 合并（QB-64），copy_process 把 clone_flags 交给 copy_fs（QB-63）；exec 只清 fs->in_exec、不拆分 fs（QB-57、QB-67），所以
    kernel_init 经 exec 成为 pid 1 后，仍在用户态与 kthreadd 及全部 kthread 共享 init_fs。
  failure_path: set_init_taskfs 绕过 set_fs_root/set_fs_pwd，没有取得新路径引用也没有释放旧路径；切换后 kdevtmpfs 的 cwd 也变成 FAT32 根；用户态 sys_chdir 直接写 curr->fs->pwd（QB-68），pid 1 若 chdir 会同时改变这些内核线程的 cwd（UB-03）。
