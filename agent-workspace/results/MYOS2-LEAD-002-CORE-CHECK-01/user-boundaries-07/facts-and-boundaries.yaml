frame_paths:
- id: FP-1
  path: 首个程序：kernel_init → kjmp_to_doexecve → kernel_execve → syscall_return_via_sysret
  frame_writer: copy_thread（内核线程分支清零整帧）；load_elf_binary 末段 START_THREAD → start_thread_common 写 ip/sp/cs/ss/flags
  built_when: kernel_thread 创建 kernel_init 时清零；exec 成功走到 START_THREAD 时写入
  sp_taker: kjmp_to_doexecve 在 exec 前保存 task_pt_regs(curr)，exec 后以内联汇编 movq 到 rsp
  consumer: syscall_return_via_sysret：flags→r11、ip→rcx、POP_REGS 恢复 15 个寄存器、跳过 5 格、popq 取 sp
  fields_consumed:
  - 13 个通用寄存器字段（POP_REGS）
  - ip（装入 rcx）
  - flags（装入 r11）
  - sp
  fields_not_consumed:
  - 原 r11、cx 两个字段（xchg 后落在 flags、ip 槽，随五格被跳过）
  - irq_nr
  - orig_ax
  - cs
  - ss
  differs: 不经过 do_syscall_64 与 syscall_exit_to_user_mode（没有信号检查）；返回时该 CPU 的 GS 状态取决于先前的进入路径或启动设置（未核）；exec 不清通用寄存器（ELF_PLAT_INIT 被注释）：进入用户态时 rcx=入口、r11=flags、rsp=用户栈，其余 13 个通用寄存器（含 rax）是清零后的
    0；exec 失败时整帧仍是 0
  evidence:
  - AB2-01
  - AB2-02
  - AB2-05
  - AB2-15
  - QB-37
  - QB-38
  - QB-50
  - SB-02
  - CORE-USER-VFS-BASELINE-05::A-C1-11
- id: FP-2
  path: 用户 fork 子任务：copy_thread → __switch_to_asm → __switch_to → ret_from_fork_asm → ret_from_fork → syscall_return_via_sysret
  frame_writer: copy_thread：*childregs = *current_pt_regs()（父任务的系统调用帧），ax = 0，给定栈时改 sp；切换帧写 ret_addr 与 bx=0
  built_when: fork 系统调用中 copy_process 调 copy_thread 时
  sp_taker: __switch_to_asm 从 TASK_threadsp 取 thread.sp（fork_frame），弹 6 个寄存器后 __switch_to 的返回把 rsp 留在 pt_regs 起点
  consumer: ret_from_fork 先经 syscall_exit_to_user_mode（可能改帧），再由 syscall_return_via_sysret 消费
  fields_consumed:
  - 13 个通用寄存器字段（POP_REGS）
  - ip（装入 rcx）
  - flags（装入 r11）
  - sp
  fields_not_consumed:
  - 原 r11、cx 两个字段（xchg 后落在 flags、ip 槽，随五格被跳过）
  - irq_nr
  - orig_ax
  - cs
  - ss
  differs: 帧内容来自父任务入口时压入的值；有 schedule_tail 与信号检查；返回时该 CPU 的 GS 状态取决于先前的进入路径（未核）
  evidence:
  - AB2-03
  - AB2-04
  - AB2-06
  - AB2-08
  - AB2-09
  - AB2-10
  - AB2-11
  - SB-03
  - SB-04
  - VT-KFRAME
- id: FP-3
  path: 普通系统调用：entry_SYSCALL_64 → do_syscall_64 → （落入）syscall_return_via_sysret
  frame_writer: entry_SYSCALL_64 依次压入 22 格；系统调用本体也可能写帧（如 execve 末段 START_THREAD）；do_syscall_64 在号小于 453 时写 ax；syscall_exit_to_user_mode 可能改帧
  built_when: 每次 syscall 指令进入内核时
  sp_taker: 入口从 pcpu_hot.top_of_stack 取内核栈；call 返回后 rsp 仍指向帧
  consumer: syscall_return_via_sysret（入口没有 SYM_CODE_END，直接落入）
  fields_consumed:
  - 13 个通用寄存器字段（POP_REGS）
  - ip（装入 rcx）
  - flags（装入 r11）
  - sp
  fields_not_consumed:
  - 原 r11、cx 两个字段（xchg 后落在 flags、ip 槽，随五格被跳过）
  - irq_nr
  - orig_ax
  - cs
  - ss
  differs: 唯一由同一任务先后执行入口与返回 swapgs 的路径（swapgs 作用于每 CPU 状态，是否成对待 NVB-4）；do_syscall_64 计算的 SYSRET 适用性不被使用；用户 execve 成功返回时，rcx、r11 被换成新的 ip、flags，ax 为返回值，其余寄存器沿用调用 execve 时压入的值（ELF_PLAT_INIT
    被注释）
  evidence:
  - AB2-13
  - AB2-14
  - AB2-16
  - QB-50
  - SB-01
  - SB-02
  - SB-16
  - VT-PTREGS
