  normal_path: kernel_init 由 kernel_thread 创建（kthread=1，QB-36），copy_process 置 PF_KTHREAD，copy_thread 把栈顶 pt_regs 清零并把 kernel_init 写入 frame->bx（AB2-05、AB2-07）。kjmp_to_doexecve 在 exec
    之前取 task_pt_regs(curr)（AB2-01、AB2-02），清 PF_KTHREAD（kernel_execve 拒绝带此标志的任务，QB-36），exec 末段 load_elf_binary 取 current_pt_regs() 并 START_THREAD（QB-37），start_thread_common 写 ip、sp、cs、ss（AB2-15）与
