  normal_path: device_add 在设备号主号非 0 时调 devtmpfs_create_node（QB-14）。节点名取 dev_name（即 kobj.name），模式固定为 0600|S_IFCHR（非块设备，QB-15）。请求挂到全局链表，唤醒 kdevtmpfs 并等待（AB3-07）；工作线程调 handle → handle_create（AB3-08），以
    AT_FDCWD 相对路径 kern_path_create，再 vfs_mknod(..., dev->devt)（QB-16）。父目录 inode 的 i_op 是 shmem_dir_inode_operations（QB-59），其 ->mknod 是 shmem_mknod（QB-17、AB3-09），它经 shmem_get_inode →
    init_special_inode 建节点（QB-18、AB3-10、AB3-11）。因为此时共享 init_fs 的 pwd 是 devtmpfs 根，节点建在内部实例的根目录下。
  failure_path: 工作线程完成通知后立即 kfree(req)；提交方随后在 wait_for_completion 中加锁、摘等待项、递减计数，再读 req->err，这些都可能作用在已释放的对象上（AB3-07、AB3-08、QB-55、QB-56，UB-02）。根切换后 kdevtmpfs 的 cwd 变成 FAT32 根，FAT32 目录没有
