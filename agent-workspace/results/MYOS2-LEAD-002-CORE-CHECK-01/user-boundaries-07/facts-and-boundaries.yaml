- id: entry.syscall_frame_return
  id_status: proposed_id
  theme: B02
  refines: null
  purpose: 普通系统调用的建帧与返回，以及三条路径共用的 syscall_return_via_sysret。
  entries:
  - mykernel/arch/x86_64/entry/entry_64.S::entry_SYSCALL_64
  - mykernel/arch/x86_64/entry/common.c::do_syscall_64
  - mykernel/arch/x86_64/entry/entry_64.S::syscall_return_via_sysret
  normal_path: entry_SYSCALL_64：swapgs，把用户 rsp 暂存到 TSS sp2，从 pcpu_hot.top_of_stack 取内核栈（AB2-13），依次压入 ss、sp、flags(r11)、cs、ip(rcx)、orig_ax(rax)、irq_nr($0x80) 和 PUSH_REGS 的 15 个寄存器，共 22
    格，正好是 pt_regs 的大小与顺序（SB-01、VT-PTREGS）；top_of_stack 由 __switch_to 设为当前任务的 task_top_of_stack（AB2-08），所以这个帧就是 task_pt_regs(current)。do_syscall_64 在号小于 __NR_syscalls 时把返回值写入 regs->ax（AB2-14），再
    syscall_exit_to_user_mode（QB-43、SB-15）。call do_syscall_64 之后没有 ret 或 jmp，紧随其后的就是 syscall_return_via_sysret（SYM_CODE_START 只展开为对齐与标签），所以返回后落入它（SB-01）：xchg 把帧中的 flags/ip 换到 r11/rcx
    槽（AB2-16），POP_REGS 装入 15 个寄存器（其中 r11、rcx 已是 flags、ip），addq $0x28 跳过 irq_nr、orig_ax、ip、cs、flags 五格，popq %rsp 取用户栈，swapgs、sti、sysretq（SB-02、VT-PTREGS）。
  failure_path: do_syscall_64 计算的 SYSRET 适用性结果（SB-16）没有被汇编使用，返回一律走 sysretq（SB-01）。号不小于 __NR_syscalls 时 ax 保持原值（即系统调用号）；表内缺项落到 __x64_sys_ni_syscall 打印后 while (1)（AB3-24、QB-29，UB-09）。
  unknown:
  - sysretq/swapgs/sti 的硬件语义与中断窗口（外部语义待核）
  - X86_top_of_stack、TSS_sp2 数值与结构布局（VT-KFRAME）
  not_covered:
  - arch_do_signal_or_restart 内部（信号子系统端点）
  - 中断/异常入口 sa_entintr_retp
