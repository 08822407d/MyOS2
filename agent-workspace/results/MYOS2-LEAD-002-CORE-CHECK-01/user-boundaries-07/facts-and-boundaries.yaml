- id: user.initramfs.init_console_reopen
  id_status: proposed_id
  theme: B03
  refines: null
  purpose: init 把标准输入、输出、错误重新指向 /dev/console；只登记用户源码、构建文本与内核已有入口。
  entries:
  - myinitramfs/myinit/initd.c::main
  normal_path: initd.c 依次 freopen("/dev/console", "r", stdin)、("w", stdout)、("w", stderr)（AB3-01）。构建文本把 C 编译器设为仓库外的 musl-gcc，只加入 myinit 与 myshell 两个子目录（QB-30）；仓库内的 mylib/myglibc 不在这次构建中，其中与
    freopen 有关的几行都被注释、没有活动定义，不能用来推断 freopen 的实现（QB-31）。内核侧已有的相关入口：open、close、read、write、writev、ioctl、fcntl，以及空实现的 dup/dup2（QB-26、QB-40、SB-05、SB-06）；表中没有 openat 与 dup3（QB-27），而它们的编号小于
    __NR_syscalls（QB-28），若被使用会落到 __x64_sys_ni_syscall（AB3-24）。
  failure_path: libc 若用 dup2 把新 fd 移到 0/1/2，内核侧没有实际动作且返回值未定义（UB-10）；若用 openat 或 dup3，会进入原地循环（UB-09）。若以含 O_CREAT 的标志打开（"w" 模式通常如此），打开最后一段的 O_CREAT 判断检查的是查找标志、总走只查找分支，/dev/console 已存在所以仍能找到；不存在的文件则不会被创建（UB-14）。哪一种成立取决于不在仓库中的
    libc（GAP-U10）。
