  - mykernel/arch/x86_64/sched/context/process_arch.c::ret_from_fork
  normal_path: copy_process 调 copy_thread（QB-35）。子任务的 pt_regs 在其内核栈顶，下面紧接 inactive_task_frame（AB2-03，VT-KFRAME），返回地址设为 ret_from_fork_asm、thread.sp 指向 fork_frame（AB2-04）。用户 fork：复制父任务当前帧（即其
    entry_SYSCALL_64 建的帧），ax 置 0，sp 只在给定新栈时改写（AB2-06）。首次切入时 __switch_to_asm 从 TASK_threadsp 取栈并弹出六个寄存器，jmp __switch_to（SB-04），__switch_to 更新 current_task 与 top_of_stack（AB2-08）后返回到 ret_addr；此时
    rsp 恰在 pt_regs 起点（VT-KFRAME）。ret_from_fork_asm 以 rsp 作 regs 调 ret_from_fork（AB2-09），后者 schedule_tail 后调用 syscall_exit_to_user_mode（AB2-10、AB2-11）；rbx 为 0 时 jmp syscall_return_via_sysret（SB-03）。新任务首次切入经此处、不回
    __schedule 尾部，见 CORE-SCHED-INTEGRATION-03::SF-C5-26。
  failure_path: 内核线程（rbx≠0）：C 层先调 fn(fn_arg)，fn 返回后汇编又 callq *%rbx 一次，然后 jmp .（AB2-10、SB-03、SB-20，UB-06）。create_kthread 建的线程 fn 都是 kthread()，其末尾调用 kthread_exit（QB-62），后者是否返回未读。
  unknown:
