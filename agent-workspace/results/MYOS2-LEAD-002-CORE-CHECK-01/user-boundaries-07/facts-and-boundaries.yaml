- id: sched.forkexec.first_user_entry_frame
  id_status: proposed_id
  theme: B02
  refines: CORE-USER-VFS-BASELINE-05::sched.forkexec.first_user_launch
  purpose: 首个用户程序进入用户态时所用寄存器帧的来源：kernel_init 线程栈顶的 pt_regs，由 copy_thread 清零、由 exec 末段写入入口与栈。
  entries:
