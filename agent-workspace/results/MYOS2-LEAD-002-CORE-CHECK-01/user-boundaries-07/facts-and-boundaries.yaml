  normal_path: kern_path 从当前任务 fs 的 root（绝对路径）或 pwd（相对路径）开始解析（QB-47），失败即返回（AB1-08）。path_mount → do_new_mount：get_fs_type 按名字取类型，找不到返回 -ENODEV（AB1-24）；devtmpfs 对外类型没有 init_fs_context，alloc_fs_context
    改用 legacy（AB1-11），vfs_get_tree 经 fc->ops->get_tree 调到 legacy_get_tree（AB1-28、QB-58），后者经 fc->fs_type->mount 取根、遇错误指针原样上交（AB1-12、AB1-25）→ public_dev_mount（AB1-13、AB1-14）。随后 do_new_mount_fc
    建 mount、lock_mount 取挂载点，do_add_mount 拒绝同一文件系统叠在其根所在的挂载点（-EBUSY，AB1-26），再经 graft_tree → mnt_set_mountpoint 把子挂载接到父挂载的 mnt_mounts（AB1-27）。之后的路径解析在每一步都直接调用 lookup_mnt（AB1-20），所以能跨入新挂载；位于挂载根且没有上层时
    ".." 停在原 dentry 并经 step_into 跨入覆盖其上的挂载（AB1-18、AB1-19）。
