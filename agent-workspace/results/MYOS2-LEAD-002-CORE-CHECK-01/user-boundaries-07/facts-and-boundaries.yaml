value_tables:
- id: VT-PTREGS
  type: ptregs_layout
  purpose: pt_regs 字段顺序、提交的生成偏移、PUSH/POP 顺序与入口压栈槽位数逐项对照
  struct_path: mykernel/arch/x86_64/include/asm/ptrace.h
  offsets_path: mykernel/include/generated/asm-offsets.h
  entry_path: mykernel/arch/x86_64/entry/entry_64.S
  asm_macros:
    R15: r15
    R14: r14
    R13: r13
    R12: r12
    RBP: bp
    RBX: bx
    R11: r11
    R10: r10
    R9: r9
    R8: r8
    RAX: ax
    RCX: cx
    RDX: dx
    RSI: si
    RDI: di
    IRQ_NR: irq_nr
    ORIG_RAX: orig_ax
    RIP: ip
    CS: cs
    EFLAGS: flags
    RSP: sp
    SS: ss
  assumptions:
  - reg_t 为 __UINT64_TYPE__（mykernel/include/linux/kernel/types.h），按类型名推断每格 8 字节，未编译核对
  - include/generated/asm-offsets.h 是提交入库的生成件，构建时由 scripts/target_kbuild.cmake 重新生成；本表只比较提交文本
- id: VT-KFRAME
  type: kframe_layout
  purpose: inactive_task_frame 与 __switch_to_asm 压弹顺序、fork_frame 中 regs 的位置；TASK_threadsp 等只核符号映射
  types_path: mykernel/arch/x86_64/sched/context/switch_to_types_arch.h
  entry_path: mykernel/arch/x86_64/entry/entry_64.S
  offsets_src_path: mykernel/arch/x86_64/kbuild/asm-offsets.c
  offsets_path: mykernel/include/generated/asm-offsets.h
  symbols:
  - TASK_threadsp
  - X86_top_of_stack
  - TSS_sp2
  assumptions:
  - TASK_threadsp=552、X86_top_of_stack=24、TSS_sp2=20 是提交生成件中的数值；与当前 task_struct/pcpu_hot/tss 布局是否一致需编译生成才能核，记 unknown
- id: VT-FLAGS
  type: flag_values
  purpose: O_CREAT 与 LOOKUP_RCU 数值相同；OPEN_FMODE 只产生访问位与 __FMODE_NONOTIFY，产生不了 FMODE_CAN_WRITE
  constants:
    O_CREAT: mykernel/include/uapi/asm-generic/fcntl.h
    LOOKUP_RCU: mykernel/include/linux/fs/namei.h
    FMODE_CAN_WRITE: mykernel/include/linux/fs/fs.h
    FMODE_NONOTIFY: mykernel/include/linux/fs/fs.h
  open_fmode_path: mykernel/include/linux/fs/fs.h
  open_fmode_parts:
  - ((flag + 1) & O_ACCMODE)
  - (flag & __FMODE_NONOTIFY)
  expect_alias: true
  expect_can_write_reachable: false
