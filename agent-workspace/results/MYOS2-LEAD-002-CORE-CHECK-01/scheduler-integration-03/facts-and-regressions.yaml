  judgement: 原函数结果若与 W 记录不同，说明 W 结论依赖 idle 键，需回到 15 号范围复核
  record_rules: 未来执行要求：同一输入在两个独立进程各完整运行一次，保存完整 stdout/stderr/退出码/终态；缺任一必需快照判 INCOMPLETE_EVIDENCE、不给排序结论；记录完整而违反候选策略判 VALID + VIOLATED（反证），不得判 COMPARATOR_INVALID；“按队首选择符合代码”与“选到目标策略要求的任务（A：队首；B：队列中不含 current 的最小键）”分栏报告。
- id: NR-5
  status: NOT_RUN
  gap: 睡眠/唤醒接合：current 快速路径与重复唤醒
  input: 子例 1：current A 已写 TASK_UNINTERRUPTIBLE、尚未 schedule；调用 try_to_wake_up(A)，随后 need_resched = 0、used < time_slice 调 pick。子例 2：B 在队列中，连续 wake_up_process(B) 两次
  observe: A 是否被插入队列、A 状态、count、pick 是否切换；子例 2 的 count 与 B 节点出现次数
  expected:
    original_A_B: 子例 1：A 不入队、状态 RUNNING、pick 不切换；子例 2：只有一个 B 节点、count 不变
  judgement: 出现重复节点或 count 与节点数不符即结构失败
  record_rules: 未来执行要求：同一输入在两个独立进程各完整运行一次，保存完整 stdout/stderr/退出码/终态；缺任一必需快照判 INCOMPLETE_EVIDENCE、不给排序结论；记录完整而违反候选策略判 VALID + VIOLATED（反证），不得判 COMPARATOR_INVALID；“按队首选择符合代码”与“选到目标策略要求的任务（A：队首；B：队列中不含 current 的最小键）”分栏报告。
- id: NR-6
  status: NOT_RUN
  gap: 生命周期全链的计费守恒与不变量（多步）
  input: 起点：idle 为 current，队列为空，jiffies = last_jiffies = 100，每次 pick 前 need_resched = 1；idle 键取 2^64-1，另做 idle 键 0 的变体。依次：wake_up_new_task(N1)、wake_up_new_task(N2)（键 0，队列 N2,N1）→ P1 @100（idle → N2，idle 尾插）→ P2 @130（N2 计 30，选 N1）→ N1 写 TASK_UNINTERRUPTIBLE 后 P3 @150（N1 计 20、不回队，选 N2）→ @160 wake_up_process(N1)（头插）→ P4 @170（N2 计 20，选 N1）→ P5 @190（N1 计 20，选 N2）→ P6 @200（N2 计 10，选 N1）；共 6 次 pick
  observe: 每步队列、count、current、各任务键、last_jiffies、返回值
  expected:
    all: 计费只覆盖被切换关闭的区间：N2 = 30 + 20 + 10 = 60，N1 = 20 + 20 = 40，合计 100 = 200 − 100；idle 从不计费；无重复节点；count = 节点数；idle 至多出现一次。idle 键为最大值时原函数、A、B 三者每步相同；idle 键为 0 时原函数在 P4 把 N2 排到 I0 之后、P5 选中 idle（N1、N2 仍可运行），A/B 则保持 idle 在尾、P5 选 N2——这是 A-R4 身份判定的回归点
    selection: 原函数与 A：队首；B：队列（不含 current）中的最小键
  judgement: 守恒或结构不变量失败即失败；选择按所选政策分栏判定
  record_rules: 未来执行要求：同一输入在两个独立进程各完整运行一次，保存完整 stdout/stderr/退出码/终态；缺任一必需快照判 INCOMPLETE_EVIDENCE、不给排序结论；记录完整而违反候选策略判 VALID + VIOLATED（反证），不得判 COMPARATOR_INVALID；“按队首选择符合代码”与“选到目标策略要求的任务（A：队首；B：队列中不含 current 的最小键）”分栏报告。
gaps:
- id: GAP-01
  what: 每 CPU 模板中 runqueues 的实际字节与装载未核（只读了模板复制与单元偏移的源码，SF-C1-21/22/23），last_jiffies 初值与其他 CPU 的 running_lhdr 内容只是推导
  effect: DV-02 表明 last_jiffies 初值不进入任何非 idle 计费；其他 CPU 不在本规格范围（DV-16）
  status: open
- id: GAP-02
  what: in_atomic()/preempt_count 的实际演变未追踪（只知启动初值为 INIT_PREEMPT_COUNT，非 0，SF-C5-27/28）
  effect: 中断后是否真正进入 schedule()、try_to_wake_up 结尾的 preempt_enable 是否会进入 __schedule 都未定；DV-04 的第一次切换时点因此未定
  status: open
- id: GAP-03
  what: switch_to 宏到 __switch_to 的展开链与汇编未逐段引用
  effect: 只引用了 current_task 的写入行
  status: open
- id: GAP-04
  what: 链接段 .data.sched_class 的实际内容未经链接器验证
  effect: DV-12 以文本命中为前提
  status: open
- id: GAP-05
  what: 其他 CPU 的 idle/runqueue 初始化与 SMP 启动未读
  effect: 所有结论限于 CPU0；唤醒与新任务在文本上都进 CPU0（V07）
  status: open
- id: GAP-06
  what: 经回调/函数指针的间接唤醒者未枚举
  effect: 直接调用者只列 d01 文本命中
  status: open
- id: GAP-07
  what: idle 能否以非 RUNNING 被切出（V08 可达性）
  effect: 决定 count == 0 分支是否可达
  status: open
- id: GAP-08
  what: 是否存在在 copy_process 与 wake_up_new_task 之间唤醒新任务的调用者
  effect: 决定 DV-13 的挂死/破环风险是否可达
  status: open
- id: GAP-10
  what: 除信号量 down_timeout 外，使用有限超时的 schedule_timeout 活动调用者（含 schedule_timeout_interruptible 等包装的调用者）未枚举；__mod_timer、timer_delete_sync 在 timer.c 之外的被调函数未读
  effect: 决定 DV-19 的失唤醒/忙等风险是否可达
  status: open
- id: GAP-11
  what: 源码中的无副作用空循环（__list_add_valid、__list_del_entry_valid、pick 的 while (next_lp == NULL);）在实际编译产物中是否保留为永久自旋
  effect: DV-05/DV-13/DV-21 中“自旋挂死”只是源码语义
  status: open
- id: GAP-09
  what: HPET 实际中断频率与 jiffies 双增的运行确认
  effect: DV-10 只是源码推导
  status: open
- id: GAP-NARROWED
  what: 已由文本关闭或收窄的读取面缺口（不再列为开放）
  effect: select_task_rq 原样返回 cpu（SF-C3-17）；cpu_rq 即 &per_cpu(runqueues, cpu)（SF-C1-26）；DEBUG 只在 Debug 构建定义、为二选一（options_flags.cmake 16-23 行）；类段在直接文本中只有 myos_rt（DV-12，仍为推导）；jiffies 与 jiffies_64 同宽（SF-ACC-06）；del_timer_sync 是 timer_delete_sync 的宏别名（SF-C3-31）
  status: narrowed_or_closed
