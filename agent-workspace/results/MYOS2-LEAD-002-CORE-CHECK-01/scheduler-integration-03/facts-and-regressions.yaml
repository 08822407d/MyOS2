    - anchor 边界与 idle 位置在结构上安全
    - W03–W06、W08 的记录不变；W07 只保持“同一 jiffies 不重复计费”，选择结果按上条改变
    cannot_promise:
    - 全局始终升序：唤醒头插仍可在队首制造逆序（DV-07），逆序未消费前回插位置可能落在更低键之前（DV-08）
    - 选中任务为最小键：唤醒后仍会出现 W07 第 2 步型选择
    preconditions:
    - 单 CPU0 队列（V07 现状；其他 CPU 队列未初始化，DV-16）
    - running_lhdr 的直接文本写入者仍只有四个（d01 F01）
    - pick 仍在 __schedule 关中断后调用
    risks:
    - 修复后低键任务（新任务键 0、长睡任务）的追赶交替变得可见（DV-09）
    - 若 A-R4 只靠 idle 键哨兵，将来 idle 被计费或键被改写时，普通任务可能被插到 idle 之后
    - BUG_ON 仍检测不到任何状态（DV-05），不应被当作保护
    existing_evidence:
    - W01
    - W02
    - W07
    - W03–W08 正常对照
    - G02/G03（头插源码）
    remaining_validation:
    - 修改后的函数在宿主夹具上重跑 W01–W08（两次完整输出）
    - NR-3、NR-4、NR-6（A 预期列）
    - 不需要改调用者
    order: 可最先准备；实施仍需 Owner 的内核修改授权（当前 kernel_change_authorized = false）。
  B:
    title: 统一队列顺序契约
    contract: running_lhdr 中非 idle 节点按更新后的 se.vruntime 非降序；idle 若在队，恒为最后一个节点；选择 = 摘除前的队首 = 队列中（不含正在运行的 current）的最小键。因为 pick 先摘队首再插回 current，current 自身即使键更小也不会在同一次切换被再次选中（W07 第 2 步在 B 下选 C20，而 current B10 更小）。
    requirements:
    - id: B-R1
      text: 回插：A-R1 至 A-R6 全部适用。
    - id: B-R2
      text: 普通唤醒（set_task_cpu）：由头插改为按键有序插入，与回插使用同一比较规则、同一“先判 anchor 再求任务”顺序，位置在 idle 之前；保留 contains 防重复（或改用 DV-22 的自环判定）；仍写 TASK_RUNNING。p == current 的快速路径不入队可保留：该任务随后由 pick 的有序回插处理。
    - id: B-R3
      text: 首次入队（wake_up_new_task）：在 B-R1、B-R2 已使队列保持有序的前提下，键 0（或按 OD-2 钳制后等于队首键的键）头插的结果与有序插入相同（DV-06），所以排序位置可以不改；现有代码中这一前提不成立（W01/W02 的回插失序），不能单独只改唤醒。需要补上“节点未链”的前置保护（现在没有 contains，DV-13/DV-21）。
    - id: B-R4
      text: idle：init_idle 仍建空队列；idle 仍由 pick 尾插、不计费；排序判断以 rq->idle 身份排除 idle，不依赖其键。
    - id: B-R5
      text: 选择：仍为摘队首，由不变量保证其为队列（不含 current）中的最小键；调试构建可断言“队首键 ≤ 次节点键”（不在本规格实现）。
    - id: B-R6
      text: 键下限（见 OD-2）：新任务与唤醒任务入队时是否把键钳制到不低于当时队首非 idle 任务的键。
    lost_or_changed:
    - 键高于队首非 idle 任务的被唤醒任务不再在下一次切换运行（失去头插优先）；新任务键 0 仍排在队首，首次入队的“下一次切换即运行”不变；设 OD-2 下限时，键不高于队首的唤醒任务也仍到队首
    - I/O 守护线程（NVMe/ATA/XHCI 的 rq_deamon）、workqueue worker、kthreadd、softirqd、信号量与定时器等待者被唤醒后的等待时间改由其键决定
    - 不设下限时，键为 0 的新任务和长睡任务反而先运行，并与最低键任务交替直到追上（DV-09）
    affected_symbols:
    - mykernel/sched/scheduler/myos_rt.c::pick_next_task_myos
    - mykernel/sched/scheduler/scheduler_core.c::set_task_cpu
    - mykernel/sched/scheduler/scheduler_core.c::wake_up_new_task（只需补前置保护，排序位置可不改）
    - 共用的有序插入 helper（位置待定：myos_rt.c 静态函数需导出给 scheduler_core.c，或 double_list.h 新原语；可能涉及 scheduler_api.h 声明）
    affected_callers_behaviour_level:
    - d01 E03 的 12 行 wake_up_process 调用
    - swake_up_locked → try_to_wake_up
    - signal_wake_up_state → wake_up_state
    - kernel_clone → wake_up_new_task（经 kernel_thread、fork 系统调用、create_kthread）
    must_keep:
    - A 的全部保持项
    - contains 防重复（V06）
    - 唤醒仍写 TASK_RUNNING 并进 CPU0（V04/V07 现状；其他 CPU 的队列未初始化，DV-16；SMP 不在本规格）
    - 唤醒返回值语义不变（恒 0；调用者无依赖变化）
    risks:
    - 唤醒延迟语义改变（见上）
    - 有序插入每次 O(n) 扫描，与 contains 的 O(n) 叠加（可用 DV-22 的自环判定去掉后者）
    - 不设下限时出现新任务追赶突发
    - 需同源复跑 V04–V07 以确认已审行为未被意外改变
    existing_evidence:
    - G02
    - G03
    - G04
    - W01
    - W02
    - W07
    - DV-07
    - DV-08
    remaining_validation:
    - A 的全部
    - NR-1、NR-2、NR-5、NR-6（B 预期列）
    - V04–V07 同源复跑（仅在其已审范围内）
    order: 在 A 之后；仅在 OD-1 选择 B 并对 OD-2 作答后准备。
owner_decisions:
- id: OD-1
  question: 运行队列的目标契约：保留“唤醒/新任务头插优先”（以候选 A 为终态），还是采用“全队按更新后 vruntime 非降序、选最小键”（候选 B）？
  recommendation: 先实施 A（不改政策，只修两处已见证的回插缺陷）；把 B 定为后续目标契约。
  reason: 活动文本中对运行队列做排序比较的只有回插循环，它比较的是 se.vruntime（SF-C4-08 的源码事实）；B 给出一条可机械检查的不变量（队首 = 最小键、全队非降序），W07 第 2 步型选择可以直接判为失败，便于学习和回归。头插优先目前没有任何键或标志表达，是隐含行为，难以测试和解释。这一建议基于项目学习与可验证性，不是对作者意图的推断。
  impact: 选 B：需改 set_task_cpu 的插入位置并给 wake_up_new_task 补前置保护；键高于队首的被唤醒任务（守护线程、等待者）不再插队，新任务仍在队首。只选 A：唤醒后仍会出现“选中非最小键”，文档与回归须把选择定义为“取队首”。
  safe_default_if_unanswered: 只准备 A；不修改 set_task_cpu、wake_up_new_task；回归按 A 的预期列判定。
- id: OD-2
  question: 新任务与被唤醒任务入队时是否设键下限？（B 下必须回答；A 下只影响修复后的追赶行为，不需实现）
  recommendation: 设最小钳制：入队键取 max(自身键, 当时队首非 idle 任务的键)；队空时保持自身键。不引入 CFS 的 min_vruntime 或权重体系。
  reason: 否则键为 0 的新任务和长睡任务会长时间与最低键任务交替、压后其余任务（DV-09）；该规则局部、可测，并保留“新任务尽快运行一次”的效果。
  impact: 新任务的首次位置仍是队首（钳制后的键等于队首键，按 A-R6 排在其前）；改变的是新任务与长睡任务的键值及之后的追赶时长；需要 NR-1 子例 2、NR-2、NR-6 覆盖。
  safe_default_if_unanswered: B 不实施；即使 OD-1 选了 B，也在本项有答复之前不准备 B（与候选 B 的先后要求一致）。
