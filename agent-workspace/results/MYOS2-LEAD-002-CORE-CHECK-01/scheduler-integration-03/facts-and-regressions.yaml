candidate_changes:
  A:
    title: 兼容现有入口语义的局部修复
    keeps:
    - wake_up_new_task 与 set_task_cpu 的头插（新任务/唤醒任务在下一次切换被选中，除非其后又有头插）
    - 选择 = 摘队首
    - idle 尾插、不计费
    - 切换条件（SF-C4-04）
    - last_jiffies 只在切换时更新
    - 阻塞 current 不插回但计费（W05）
    - 同一时刻不重复计费（W07 第 2 步）
    - 不切换不计费（W08）
    - contains 防重复（V06）
    requirements:
    - id: A-R1
      text: 计费时点：在切换块内先对非 idle 的 current 记入 used_jiffies，再用更新后的键决定插回位置。
      evidence:
      - W02
      - W07
    - id: A-R2
      text: 比较对象随游标：插回扫描的每一步都与游标当前所在节点的任务键比较。
      evidence:
      - W01
    - id: A-R3
      text: anchor 先判：在把游标节点换算为任务之前，先判断游标是否已回到 anchor；不得对 anchor 求所属任务。这同时消除现有代码在“摘除后队列为空”时已发生的伪任务指针读取。
      evidence:
      - DV-11
    - id: A-R4
      text: idle 边界：非 idle 的插回位置不得越过 idle；以 rq->idle 身份判断，不依赖 idle 键恰好为最大值。
      evidence:
      - W01
      - DV-01
    - id: A-R5
      text: 计数：链接与 count + 1 作为一个操作完成，语义等同 header 原语；保持前置条件“current 的节点此刻未链接”（它在被选中时已经 remove_head + list_del_init 自环）。
      evidence:
      - SF-C4-09
      - SF-LST-09
      - SF-LST-06
    - id: A-R6
      text: 并列：插在第一个键不小于自己的节点之前，与现行比较用严格大于一致。现有 W 记录中没有真正的并列比较（W04 是先按旧键定位后计费）；A 下 W04 成为首个并列输入，预期结果不变。
      evidence:
      - SF-C4-08
      - W04
    optional_hardening_separate_review:
    - id: A-O1
      text: 可选的防御性初始化：在 init_idle（或等价初始化点）显式写 last_jiffies = jiffies。按 DV-02 不改变现有任何计费输出，只去掉对初值的依赖；若采用，受影响符号增加 scheduler_core.c::init_idle。
    - id: A-O2
      text: 可选的结构加固（与排序政策无关）：首次入队前确认节点未链接（可用 DV-22 的 O(1) 自环判定），或在普通唤醒中不处理 TASK_NEW。后者会改变 V05 记录的现状，需单独决定；两者都针对 DV-13，可达性未定。
    observable_change: 只在 W01、W02、W07 这类输入上改变插回位置与随后的选择：W01、W02 变为 C20,A25,D30,I；W07 第 1 步变为 C20,A25,D30,I，第 2 步改选 C20（仍保持同一 jiffies 不重复计费）。W03–W06、W08 的记录应保持不变（预期，NOT_RUN）。唤醒、新任务和选择规则不变。
    affected_symbols:
    - mykernel/sched/scheduler/myos_rt.c::pick_next_task_myos（唯一必改符号）
    - 可选：mykernel/lib/list/double_list.h 新增“插到指定节点前并计数”的 header 原语（若采用，影响 lib/list，需单独评审）
    guarantees:
    - 消除 W01、W02 两类已见证的回插失序
    - 消除现有代码在“摘除后队列为空”时经 anchor 求伪任务指针的读取（DV-11）
